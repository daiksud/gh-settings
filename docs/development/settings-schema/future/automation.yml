# English personal-public forms inspected on 2026-11-27. Conditional Actions
# controls were expanded in an unsaved new policy. Each mapping below groups
# independently optional fields. API evidence for Cloud and Actions policies
# uses the api.github.com.2026-03-10 OpenAPI document at github/rest-api-description
# commit d560905bbf50d79e40d6a006ce2e5834cfd86a31. A reserved enum extension
# applies only to the listed new choice of an already accepted field.
- path: repository.settings.actions.policies[].enforcement_status
  type: enum
  status: reserved
  extension: enum
  ui: Enforcement status / Evaluate
  evidence: &policy https://github.com/daiksud/gh-settings/settings/actions/rules/new?target=actions&enforcement=disabled
  choices: [evaluate]
  api: Repository policy GET, POST and PUT reference the shared enforcement enum including evaluate. Its description specifies an enterprise prerequisite. Successful persistence on this personal repository is unverified.
  meaning: Evaluates a policy for its insights without enforcing it. Branch and tag Rulesets have a separate selector.
- path: repository.settings.actions.policies[].workflow_execution_protections.require_lockfile
  type: boolean
  status: reserved
  ui: Workflow execution protections / Require lockfile
  evidence: *policy
  after: restrict_events
  api: The official repository Actions policy rule union lists actor and event restrictions. A lockfile rule read/update contract is unconfirmed.
  ownership: On a selected policy, false disables this rule, true enables it, and omission preserves its observed state. Unknown protections must prevent a destructive full-policy write.

- path: repository.settings.copilot.code_review.general.review_effort_level
  type: enum
  status: reserved
  extension: enum
  ui: General / Review effort level / Adaptive
  evidence:
    - &review https://github.com/daiksud/gh-settings/settings/copilot/code_review
    - https://docs.github.com/en/rest/copilot/copilot-code-review#update-copilot-code-review-settings-for-a-repository
  choices: [adaptive]
  api: The repository GET listed adaptive among available_review_efforts on 2026-11-27. PATCH accepts repository-available efforts. No change was submitted.
  meaning: An explicit adaptive effort is distinct from the existing default choice which requests inheritance.
- path: repository.settings.copilot.code_review.general.maximum_review_effort
  type: enum
  status: reserved
  ui: General / Maximum review effort
  evidence:
    - *review
    - &reviewGuide https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review#configuring-copilot-code-review-with-the-api
  choices: [no_limit, lite, balanced, max]
  after: review_effort_level
  before: allow_copilot_to_use_mcp_tools_when_reviewing_pull_requests
  api: The configuration guide explicitly excludes maximum effort from the API.
  ownership: Omission leaves the ceiling unmanaged. The no_limit choice explicitly removes the repository ceiling.
- path: repository.settings.copilot.code_review.security
  type: mapping
  status: reserved
  ui: Code review / Security
  evidence: *review
  after: general
- path: repository.settings.copilot.code_review.security.secret_protection_ai_scan
  type: boolean
  status: reserved
  ui: Security / Secret Protection AI Scan
  evidence: *review
  api: An official repository read and setter for this Copilot review preference are unconfirmed.
  meaning: Selects secret scanning during Copilot review. The Advanced Security page controls different scans.
- path: repository.settings.copilot.code_review.approvals
  type: mapping
  status: reserved
  ui: Code review / Approvals
  evidence: [*review, *reviewGuide]
  after: security
  api: The official configuration guide excludes approvals from the API.
- path: repository.settings.copilot.code_review.approvals.allow_copilot_to_approve_pull_requests
  type: boolean
  status: reserved
  ui: Approvals / Allow Copilot to approve pull requests
  evidence: *review
- path: repository.settings.copilot.code_review.approvals.allow_copilot_approvals_to_count_toward_merge_requirements
  type: boolean
  status: unconfirmed
  ui: Allow Copilot approvals to count toward merge requirements
  evidence:
    - *review
    - https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review#configuring-automatic-code-review-for-a-repository
  condition: Documented as a separate checkbox. The inspected personal repository showed a single approval switch and the optional file paths field.
  after: allow_copilot_to_approve_pull_requests
  api: The configuration guide excludes approvals from the API.
  meaning: Confirm an independently selectable second control before accepting a separate key. No value can be inferred from the first switch.
- path: repository.settings.copilot.code_review.approvals.limit_approvals_to_certain_file_paths
  type: list
  items: string
  status: reserved
  ui: Approvals / Limit approvals to certain file paths (optional)
  evidence: *review
  after: allow_copilot_to_approve_pull_requests
  condition: The repository Approvals panel displays this input with approvals enabled.
  ownership: At most 15 file-glob strings, one per UI line. An explicit empty list allows all file paths. Omission leaves the configured restrictions unmanaged.
- path: repository.settings.copilot.code_review.access_and_licensing
  type: mapping
  status: reserved
  ui: Code review / Access and licensing
  after: approvals
  evidence: *review
- path: repository.settings.copilot.code_review.access_and_licensing.block_reviews_requested_with_an_external_copilot_license
  type: boolean
  status: reserved
  ui: Access and licensing / Block reviews requested with an external Copilot license
  evidence: *review
  api: The guide excludes billing settings. A separate read/update contract for the repository restriction is unconfirmed.

