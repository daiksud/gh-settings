name: GitHub repository settings
author: Daiki Sudo
description: Export, validate, plan or directly apply checkout-root settings with its verified release CLI on GitHub-hosted Ubuntu 24.04 x64.
inputs:
  prune:
    description: Optional comma-separated deletion scopes for plan/apply. Currently labels,rulesets,actions-variables,agents-variables,environment-variables,actions-policies,environments,collaborators, or standalone all; omitted collections stay unmanaged and explicit [] prunes all.
    required: false
    default: ''
  plan-reporting:
    description: Plan reporting, detailed or status-only; status-only hides settings values and raw diagnostics. Only supported for plan.
    required: false
    default: detailed
  command:
    description: Required command, exactly export, validate, plan or apply.
    required: true
  token:
    description: >-
      Explicit target-scoped GitHub App installation token for export/plan/apply;
      unused for validate. Export and plan are nonmutating but complete reads may need write
      grants (for example Ruleset bypass visibility). Exposure is scoped to
      the command-step environment; the composite shares the caller job. The caller
      owns approval and token lifecycle.
    required: false
outputs:
  config-path:
    description: Successful export destination, .github/settings.yml relative to the checkout root; empty for other commands. The file is not committed or published.
    value: ${{ steps.result.outputs.config-path }}
  plan-outcome:
    description: Successful status-only plan outcome, changed, no-difference or unmanaged; empty for detailed plans and export/validate/apply.
    value: ${{ steps.result.outputs.plan-outcome }}
  config-sha:
    description: Full checkout HEAD commit SHA; not a hash or commit of the exported file.
    value: ${{ steps.result.outputs.config-sha }}
  target:
    description: Configuration checkout origin in OWNER/REPO form.
    value: ${{ steps.result.outputs.target }}
  cli-version:
    description: Verified installed CLI release version.
    value: ${{ steps.result.outputs.cli-version }}
  cli-sha256:
    description: SHA-256 of the verified installed CLI binary.
    value: ${{ steps.result.outputs.cli-sha256 }}
runs:
  using: composite
  steps:
    - name: Check command and explicit token requirement
      shell: bash
      env:
        SETTINGS_PRUNE: ${{ inputs.prune }}
        SETTINGS_COMMAND: ${{ inputs.command }}
        HAS_TOKEN: ${{ inputs.token != '' }}
        PLAN_REPORTING: ${{ inputs.plan-reporting }}
      run: |
        case "$SETTINGS_COMMAND" in
          export|validate|plan|apply) ;;
          *) echo 'command must be export, validate, plan or apply' >&2; exit 1 ;;
        esac
        if [[ "$SETTINGS_COMMAND" != plan && "$SETTINGS_COMMAND" != apply && -n "$SETTINGS_PRUNE" ]]; then
          echo 'prune requires plan or apply' >&2
          exit 1
        fi
        case "$PLAN_REPORTING" in
          detailed) ;;
          status-only) [[ "$SETTINGS_COMMAND" == plan ]] || { echo 'status-only reporting requires plan' >&2; exit 1; } ;;
          *) echo 'invalid plan reporting mode' >&2; exit 1 ;;
        esac
        if [[ "$SETTINGS_COMMAND" != validate && "$HAS_TOKEN" != true ]]; then
          echo 'export, plan and apply require an explicit token input' >&2
          exit 1
        fi
    - name: Install CLI and resolve checkout metadata
      id: setup
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SETTINGS_ACTION_REF: ${{ github.action_ref }}
        PLAN_REPORTING: ${{ inputs.plan-reporting }}
      run: |
        unset GH_TOKEN GITHUB_TOKEN
        binary=$(bash "$ACTION_PATH/action/install-cli.sh")
        if [[ "$PLAN_REPORTING" == status-only ]]; then
          if ! capability=$("$binary" action private-reporting 2>/dev/null) || [[ "$capability" != status-only-v1 ]]; then
            echo 'installed CLI does not support private plan reporting' >&2
            exit 1
          fi
          if ! "$binary" action metadata >> "$GITHUB_OUTPUT" 2>/dev/null; then
            echo 'checkout metadata failed' >&2
            exit 1
          fi
        else
          "$binary" action metadata >> "$GITHUB_OUTPUT"
        fi
        printf 'binary-path=%s\n' "$binary" >> "$GITHUB_OUTPUT"
    - name: Validate checkout settings without authentication
      if: inputs.command == 'validate'
      shell: bash
      env:
        SETTINGS_CLI: ${{ steps.setup.outputs.binary-path }}
      run: |
        unset GH_TOKEN GITHUB_TOKEN
        "$SETTINGS_CLI" validate
    - name: Execute export, plan or apply with the caller token
      id: execute
      if: inputs.command != 'validate'
      shell: bash
      env:
        SETTINGS_CLI: ${{ steps.setup.outputs.binary-path }}
        SETTINGS_PRUNE: ${{ inputs.prune }}
        SETTINGS_COMMAND: ${{ inputs.command }}
        PLAN_REPORTING: ${{ inputs.plan-reporting }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        unset GITHUB_TOKEN
        status=0
        umask 077
        if [[ -n "$SETTINGS_PRUNE" ]]; then
          "$SETTINGS_CLI" action prune-support >/dev/null || { echo 'installed CLI does not support prune' >&2; exit 1; }
        fi
        if [[ "$SETTINGS_COMMAND" == plan ]]; then
          if [[ "$PLAN_REPORTING" == status-only ]]; then
            unset GH_DEBUG
            "$SETTINGS_CLI" action plan "${SETTINGS_CLI%/*}/plan.json" status-only >/dev/null 2>&1 || status=$?
            if [[ "$status" != 0 ]]; then
              echo 'private plan failed' >&2
            fi
          else
            "$SETTINGS_CLI" action plan "${SETTINGS_CLI%/*}/plan.json" || status=$?
          fi
        elif [[ "$SETTINGS_COMMAND" == export ]]; then
          unset GH_DEBUG
          "$SETTINGS_CLI" export >/dev/null || status=$?
        else
          apply_args=(apply)
          [[ -z "$SETTINGS_PRUNE" ]] || apply_args+=(--prune "$SETTINGS_PRUNE")
          "$SETTINGS_CLI" "${apply_args[@]}" || status=$?
        fi
        [[ "$SETTINGS_COMMAND" == plan ]] || exit "$status"
        if ! printf 'exit-status=%s\n' "$status" >> "$GITHUB_OUTPUT"; then
          [[ "$status" != 0 ]] || status=1
          exit "$status"
        fi
    - name: Render plan Summary and return the plan status
      id: review
      if: inputs.command == 'plan'
      shell: bash
      env:
        SETTINGS_CLI: ${{ steps.setup.outputs.binary-path }}
        PLAN_REPORTING: ${{ inputs.plan-reporting }}
        PLAN_STATUS: ${{ steps.execute.outputs.exit-status }}
        SETTINGS_ACTOR: ${{ github.actor }}
        SETTINGS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        SETTINGS_EVENT: ${{ github.event_name }}
        SETTINGS_RUN_ID: ${{ github.run_id }}
        SETTINGS_RUN_ATTEMPT: ${{ github.run_attempt }}
        SETTINGS_WORKFLOW_REF: ${{ github.workflow_ref }}
        SETTINGS_WORKFLOW_SHA: ${{ github.workflow_sha }}
        SETTINGS_ACTION_REPOSITORY: ${{ github.action_repository }}
        SETTINGS_ACTION_REF: ${{ github.action_ref }}
        SETTINGS_CONFIG_SHA: ${{ steps.setup.outputs.config-sha }}
        SETTINGS_TARGET: ${{ steps.setup.outputs.target }}
        SETTINGS_CLI_VERSION: ${{ steps.setup.outputs.cli-version }}
        SETTINGS_CLI_SHA256: ${{ steps.setup.outputs.cli-sha256 }}
      run: |
        unset GH_TOKEN GITHUB_TOKEN
        summary_status=0
        if [[ "$PLAN_REPORTING" == status-only ]]; then
          "$SETTINGS_CLI" action summary "${SETTINGS_CLI%/*}/plan.json" "$GITHUB_STEP_SUMMARY" status-only >> "$GITHUB_OUTPUT" || summary_status=$?
        else
          "$SETTINGS_CLI" action summary "${SETTINGS_CLI%/*}/plan.json" "$GITHUB_STEP_SUMMARY" || summary_status=$?
        fi
        [[ "$PLAN_STATUS" == 0 ]] || exit "${PLAN_STATUS:-1}"
        exit "$summary_status"
    - name: Remove ephemeral plan data
      if: always() && inputs.command == 'plan'
      shell: bash
      env:
        SETTINGS_CLI: ${{ steps.setup.outputs.binary-path }}
      run: |
        unset GH_TOKEN GITHUB_TOKEN
        if [[ -n "$SETTINGS_CLI" ]]; then
          if ! rm -f -- "${SETTINGS_CLI%/*}/plan.json" 2>/dev/null; then
            echo 'plan cleanup failed' >&2
            exit 1
          fi
        fi
    - name: Publish successful result
      id: result
      shell: bash
      env:
        CONFIG_SHA: ${{ steps.setup.outputs.config-sha }}
        TARGET: ${{ steps.setup.outputs.target }}
        CLI_VERSION: ${{ steps.setup.outputs.cli-version }}
        CLI_SHA256: ${{ steps.setup.outputs.cli-sha256 }}
        PLAN_OUTCOME: ${{ steps.review.outputs.plan-outcome }}
        SETTINGS_COMMAND: ${{ inputs.command }}
      run: |
        printf 'config-sha=%s\ntarget=%s\ncli-version=%s\ncli-sha256=%s\n' \
          "$CONFIG_SHA" "$TARGET" "$CLI_VERSION" "$CLI_SHA256" >> "$GITHUB_OUTPUT"
        if [[ -n "$PLAN_OUTCOME" ]]; then
          printf 'plan-outcome=%s\n' "$PLAN_OUTCOME" >> "$GITHUB_OUTPUT"
        fi
        if [[ "$SETTINGS_COMMAND" == export ]]; then
          printf 'config-path=.github/settings.yml\n' >> "$GITHUB_OUTPUT"
        fi
