# Supported, applicable settings observed on this repository; no pruning.
# Environment variable values remain unmanaged and are not published here.
version: daiksud/gh-settings@v0
repository:
  about:
    description: Manage GitHub repository settings as code
    website: ""
    topics:
      - github-cli
      - settings-as-code
