schemaVersion: 1
settings:
  repository:
    # Omitted fields remain unmanaged.
    # Protected main provides review; the main-only Environment adds no approval.
    description: "Manage GitHub repository settings as code"
    homepage: ""
    default_branch: main
    has_issues: true
    has_projects: true
    has_wiki: true
    has_discussions: false
    web_commit_signoff_required: false
    is_template: false
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    delete_branch_on_merge: true
    allow_auto_merge: true
    allow_update_branch: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
    has_pull_requests: true
    pull_request_creation_policy: ALL
    issue_creation_policy: ALL
  topics:
    names:
      - github-cli
      - settings-as-code
  labels:
    - name: accessibility
      color: f143ab
      description: Barrier affecting people with disabilities
    - name: bug
      color: d73a4a
      description: Something isn't working
    - name: documentation
      color: 0075ca
      description: Improvements or additions to documentation
    - name: duplicate
      color: cfd3d7
      description: This issue or pull request already exists
    - name: enhancement
      color: a2eeef
      description: New feature or request
    - name: good first issue
      color: 7057ff
      description: Good for newcomers
    - name: help wanted
      color: "008672"
      description: Extra attention is needed
    - name: invalid
      color: e4e669
      description: This doesn't seem right
    - name: question
      color: d876e3
      description: Further information is requested
    - name: wontfix
      color: ffffff
      description: This will not be worked on
  rulesets:
    - name: default
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
          exclude: []
      bypass_actors: []
      rules:
        - type: deletion
        - type: non_fast_forward
        - type: pull_request
          parameters:
            allowed_merge_methods:
              - squash
            dismiss_stale_reviews_on_push: true
            require_code_owner_review: true
            require_extra_approval_for_unattributed_changes: false
            require_last_push_approval: false
            required_approving_review_count: 1
            required_review_thread_resolution: true
            required_reviewers: []
        - type: required_linear_history
        - type: required_status_checks
          parameters:
            required_status_checks:
              - context: gh-settings
                integration_id: 15368
              - context: pass
                integration_id: 15368
            strict_required_status_checks_policy: true
            do_not_enforce_on_create: false
  actions:
    fork_pr_approval_policy: first_time_contributors
    artifact_and_log_retention_days: 90
    default_workflow_permissions: read
    can_approve_pull_request_reviews: true
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
  security:
    secret_scanning: true
    secret_scanning_push_protection: true
    private_vulnerability_reporting: true
