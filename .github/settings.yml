# Observed settings within the existing self-management credential boundary; no pruning.
# Private variable payloads and controls needing additional/unconfirmed grants stay omitted.
version: daiksud/gh-settings@v0
repository:
  about:
    description: Manage GitHub repository settings as code
    website: ""
    topics:
      - github-cli
      - settings-as-code
  labels:
    - id: 12636240708
      name: accessibility
      description: Barrier affecting people with disabilities
      color: '#f143ab'
    - id: 12928058534
      name: bug
      description: Something isn't working
      color: '#d73a4a'
    - id: 13166812262
      name: dependencies
      description: Pull requests that update a dependency file
      color: '#0366d6'
    - id: 12928058575
      name: documentation
      description: Improvements or additions to documentation
      color: '#0075ca'
    - id: 12636240741
      name: duplicate
      description: This issue or pull request already exists
      color: '#cfd3d7'
    - id: 12928058612
      name: enhancement
      description: New feature or request
      color: '#a2eeef'
    - id: 13166812303
      name: github_actions
      description: Pull requests that update GitHub Actions code
      color: '#000000'
    - id: 12636240788
      name: good first issue
      description: Good for newcomers
      color: '#7057ff'
    - id: 12636240774
      name: help wanted
      description: Extra attention is needed
      color: '#008672'
    - id: 12636240800
      name: invalid
      description: This doesn't seem right
      color: '#e4e669'
    - id: 12636240818
      name: question
      description: Further information is requested
      color: '#d876e3'
    - id: 12636240834
      name: wontfix
      description: This will not be worked on
      color: '#ffffff'
  settings:
    general:
      template_repository: false
      default_branch: main
      releases:
        enable_release_immutability: true
      features:
        wikis: false
        issues: true
        issue_permissions:
          creation_allowed_by: all_users
        sponsorships: false
        discussions: false
        projects: false
        pull_requests: true
        pull_request_permissions:
          creation_allowed_by: all_users
      pull_requests:
        allow_merge_commits: false
        allow_squash_merging: true
        squash_merging:
          default_commit_message: pull_request_title_and_description
        allow_rebase_merging: false
        always_suggest_updating_pull_request_branches: true
        allow_auto_merge: true
        automatically_delete_head_branches: true
      commits:
        require_contributors_to_sign_off_on_web_based_commits: false
      danger_zone:
        archive_this_repository: false
    collaborators: []
    moderation:
      interaction_limits:
        pull_request_limits:
          limit_open_pull_requests_from_users_without_write_access: false
          exemption_list: []
          maximum_open_pull_requests_per_user: 1
          count_draft_pull_requests_toward_the_limit: false
    rulesets:
      - id: 24911852
        ruleset_name: default
        enforcement_status: active
        bypass_list:
          - role: repository_admin
            bypass_mode: for_pull_requests_only
        target_branches:
          include_default_branch: true
          include_all_branches: false
          include_by_pattern: []
          exclude_by_pattern: []
        rules:
          restrict_creations: false
          restrict_deletions: true
          require_linear_history: true
          require_signed_commits: false
          require_a_pull_request_before_merging:
            required_approvals: 1
            dismiss_stale_pull_request_approvals_when_new_commits_are_pushed: true
            require_review_from_code_owners: true
            require_approval_of_the_most_recent_reviewable_push: false
            require_conversation_resolution_before_merging: true
            require_an_additional_approval_for_unattributed_copilot_pull_requests: true
            allowed_merge_methods:
              - squash
          require_status_checks_to_pass:
            require_branches_to_be_up_to_date_before_merging: true
            do_not_require_status_checks_on_creation: false
            required_status_checks:
              - check: commitlint
                source:
                  app: 15368
              - check: screening
                source:
                  app: 15368
              - check: settings-pr
                source:
                  app: 15368
          block_force_pushes: true
          require_code_scanning_results:
            code_scanning_tools:
              - tool_name: CodeQL
                security_alerts: high_or_higher
                alerts: errors
          require_code_quality_results:
            severity: errors
    actions:
      general:
        actions_permissions:
          policy: allow_all_actions_and_reusable_workflows
          require_actions_to_be_pinned_to_a_full_length_commit_sha: true
        check_workflow_run_status_artifact_and_log_retention: 90
        cache:
          cache_retention: 7
        approval_for_running_fork_pull_request_workflows_from_contributors: require_approval_for_first_time_contributors
        workflow_permissions:
          default_permissions: read_repository_contents_and_packages_permissions
          allow_github_actions_to_create_and_approve_pull_requests: true
      runners: []
      policies: []
      variables: []
    webhooks: []
    environments:
      - name: gh-settings
        deployment_protection_rules:
          required_reviewers:
            - person: 155234749
          prevent_self_review: false
          wait_timer: 0
          custom_rules: []
          allow_administrators_to_bypass_configured_protection_rules: false
        deployment_branches_and_tags: selected_branches_and_tags
        deployment_branch_or_tag_rules:
          - ref_type: branch
            name_pattern: main
    advanced_security:
      private_vulnerability_reporting: true
      dependabot:
        alerts: true
        security_updates: true
      code_security:
        codeql_analysis:
          default_setup: true
          languages:
            - github_actions
            - go
            - javascript_typescript
            - python
          query_suites: extended
          runner:
            type: standard_github_runner
          threat_model: remote_sources
      secret_protection:
        enabled: true
        push_protection: true
    deploy_keys: []
    agents:
      variables: []
