version: daiksud/gh-settings@v0
repository:
  # Omitted fields remain unmanaged.
  about:
    description: "Manage GitHub repository settings as code"
    website: ""
    topics:
      - github-cli
      - settings-as-code
  # Unlisted labels remain unmanaged and are never deleted.
  labels:
    - id: 12636240708
      name: accessibility
      color: '#f143ab'
      description: Barrier affecting people with disabilities
    - id: 12928058534
      name: bug
      color: '#d73a4a'
      description: Something isn't working
    - id: 12928058575
      name: documentation
      color: '#0075ca'
      description: Improvements or additions to documentation
    - id: 12636240741
      name: duplicate
      color: '#cfd3d7'
      description: This issue or pull request already exists
    - id: 12928058612
      name: enhancement
      color: '#a2eeef'
      description: New feature or request
    - id: 12636240788
      name: good first issue
      color: '#7057ff'
      description: Good for newcomers
    - id: 12636240774
      name: help wanted
      color: '#008672'
      description: Extra attention is needed
    - id: 12636240800
      name: invalid
      color: '#e4e669'
      description: This doesn't seem right
    - id: 12636240818
      name: question
      color: '#d876e3'
      description: Further information is requested
    - id: 12636240834
      name: wontfix
      color: '#ffffff'
      description: This will not be worked on
  settings:
    general:
      template_repository: false
      default_branch: main
      features:
        wikis: true
        issues: true
        sponsorships: false
        discussions: false
        projects: true
        pull_requests: true
        issue_permissions:
          creation_allowed_by: all_users
        pull_request_permissions:
          creation_allowed_by: all_users
      pull_requests:
        allow_merge_commits: false
        allow_squash_merging: true
        allow_rebase_merging: false
        always_suggest_updating_pull_request_branches: true
        allow_auto_merge: true
        automatically_delete_head_branches: true
        squash_merge:
          default_commit_message: pull_request_title_and_description
        # Normal merges are disabled; their retained message remains unmanaged.
      commits:
        require_contributors_to_sign_off_on_web_based_commits: false
      danger_zone:
        archive_this_repository: false
    # Existing values only. Inactive selected-action and private-fork controls
    # remain omitted; this public target does not adopt private policy values.
    actions:
      general:
        actions_permissions:
          policy: allow_all_actions_and_reusable_workflows
          require_actions_to_be_pinned_to_a_full_length_commit_sha: true
        workflow_permissions:
          default_permissions: read_repository_contents_and_packages_permissions
          allow_github_actions_to_create_and_approve_pull_requests: true
        check_workflow_run_status_artifact_and_log_retention: 90
        approval_for_running_fork_pull_request_workflows_from_contributors: require_approval_for_first_time_contributors
    advanced_security:
      private_vulnerability_reporting: true
      secret_protection:
        enabled: true
        push_protection: true
    # Manage only the settings credential Environment. Unlisted names stay
    # unmanaged; API Environment/pattern IDs are not declarative identities.
    environments:
      - name: gh-settings
        deployment_protection_rules:
          wait_timer: 0
          prevent_self_review: false
          required_reviewers:
            - person: 155234749 # daiksud
          allow_administrators_to_bypass_configured_protection_rules: false
        deployment_branches_and_tags: selected_branches_and_tags
        deployment_branch_or_tag_rules:
          - ref_type: branch
            name_pattern: main
    # Preserve the existing ID-owned main Ruleset and its check-source App IDs.
    # Protected main and the main-only Environment require their own approvals.
    rulesets:
      - id: 24911852
        ruleset_name: default
        enforcement_status: active
        target_branches:
          include_default_branch: true
          include_by_pattern: []
          exclude_by_pattern: []
        # Retain the existing GitHub policy; this does not authorize bypass use.
        bypass_list:
          - role: repository_admin
            bypass_mode: for_pull_requests_only
        rules:
          restrict_deletions: true
          block_force_pushes: true
          require_linear_history: true
          require_signed_commits: false
          require_code_scanning_results:
            code_scanning_tools:
              - tool_name: CodeQL
                alerts: errors
                security_alerts: high_or_higher
          require_code_quality_results:
            severity: errors
          require_a_pull_request_before_merging:
            required_approvals: 1
            dismiss_stale_pull_request_approvals_when_new_commits_are_pushed: true
            require_review_from_specific_teams: []
            require_review_from_code_owners: true
            require_approval_of_the_most_recent_reviewable_push: false
            require_conversation_resolution_before_merging: true
            require_an_additional_approval_for_unattributed_copilot_pull_requests: true
            allowed_merge_methods: [squash]
          require_status_checks_to_pass:
            require_branches_to_be_up_to_date_before_merging: true
            do_not_require_status_checks_on_creation: false
            required_status_checks:
              - check: ci-pr
                source: {app: 15368}
              - check: prlint
                source: {app: 15368}
              - check: settings-pr
                source: {app: 15368}
  # Unsupported examples only; never active desired state:
  # collaborators: []  # Unsupported: collaborator/team access management.
  # secrets: {}        # Unsupported: repository or Environment secrets.
  # variables: {}      # Unsupported: repository or Environment variables.
