schemaVersion: 1
settings:
  repository:
    # Omitted fields remain unmanaged.
    # Protected main provides review; the main-only Environment adds no approval.
    description: "Manage GitHub repository settings as code"
    homepage: ""
    has_issues: true
    has_projects: true
    has_wiki: true
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    delete_branch_on_merge: true
    allow_auto_merge: true
    allow_update_branch: true
    squash_merge_commit_title: COMMIT_OR_PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  topics:
    names:
      - github-cli
      - settings-as-code
  labels:
    - name: accessibility
      color: f143ab
      description: Barrier affecting people with disabilities
    - name: bug
      color: d73a4a
      description: Something isn't working
    - name: documentation
      color: 0075ca
      description: Improvements or additions to documentation
    - name: duplicate
      color: cfd3d7
      description: This issue or pull request already exists
    - name: enhancement
      color: a2eeef
      description: New feature or request
    - name: good first issue
      color: 7057ff
      description: Good for newcomers
    - name: help wanted
      color: "008672"
      description: Extra attention is needed
    - name: invalid
      color: e4e669
      description: This doesn't seem right
    - name: question
      color: d876e3
      description: Further information is requested
    - name: wontfix
      color: ffffff
      description: This will not be worked on
