schemaVersion: 1
settings:
  repository:
    # Omitted fields remain unmanaged.
    # Protected main provides review; the main-only Environment adds no approval.
    description: "Manage GitHub repository settings as code"
    homepage: ""
    default_branch: main
    has_issues: true
    has_projects: true
    has_wiki: true
    has_discussions: false
    web_commit_signoff_required: false
    is_template: false
    # Explicitly retain the observed active lifecycle and disabled Sponsor button.
    archived: false
    has_sponsorships: false
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    delete_branch_on_merge: true
    allow_auto_merge: true
    allow_update_branch: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    # GitHub rejects normal-merge metadata while normal merges are disabled.
    # Its retained PR_TITLE/PR_BODY defaults therefore remain unmanaged.
    has_pull_requests: true
    pull_request_creation_policy: ALL
    issue_creation_policy: ALL
  topics:
    names:
      - github-cli
      - settings-as-code
  # Only these existing IDs are managed; unlisted labels are never deleted.
  # Retain every supported value explicitly when adopting whole objects.
  labels:
    - id: 12791426851
      name: BREAKING CHANGE
      color: b60205
      description: Backward-incompatible user-visible behavior or public interface
    - id: 12791427001
      name: DEPRECATED
      color: fbca04
      description: Public feature or behavior marked for future removal
    - id: 12791427084
      name: feat
      color: 0e8a16
      description: New user-facing capability or behavior
    - id: 12791427113
      name: fix
      color: 0052cc
      description: Correction to user-observable product behavior
    - id: 12791427162
      name: perf
      color: 7fd18a
      description: Runtime performance improvement experienced by product users
    - id: 12791427291
      name: revert
      color: 79b8ff
      description: Reverts a previous change; assess resulting user impact
    - id: 12791427042
      name: docs
      color: c4b5e0
      description: Documentation or contributor and reviewer guidance
    - id: 12791427206
      name: refactor
      color: 8ec9cc
      description: Implementation restructuring without user-observable behavior changes
    - id: 12791427403
      name: style
      color: b5dcde
      description: Formatting changes without behavior changes
    - id: 12791427479
      name: test
      color: d8ecec
      description: Test-only additions or corrections
    - id: 12791426886
      name: build
      color: a8aeb4
      description: Build, packaging, release tooling, or dependency management
    - id: 12791426962
      name: ci
      color: cfd3d7
      description: CI checks and repository development automation
    - id: 12791426923
      name: chore
      color: ededed
      description: Maintenance not covered by a more specific change type
    - id: 12636240708
      name: accessibility
      color: f143ab
      description: Accessibility issues or improvements
    - id: 12636240741
      name: duplicate
      color: cfd3d7
      description: This issue or pull request already exists
    - id: 12636240788
      name: good first issue
      color: 7057ff
      description: Good for newcomers
    - id: 12636240774
      name: help wanted
      color: "008672"
      description: Extra attention is needed
    - id: 12636240800
      name: invalid
      color: e4e669
      description: This does not seem right
    - id: 12636240818
      name: question
      color: d876e3
      description: Further information is requested
    - id: 12636240834
      name: wontfix
      color: ffffff
      description: This will not be worked on
  # These are existing live values, not a policy change. Inactive selected-action
  # settings and private-fork workflow controls remain unmanaged.
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    default_workflow_permissions: read
    can_approve_pull_request_reviews: true
    artifact_and_log_retention_days: 90
    fork_pr_approval_policy: first_time_contributors
  security:
    private_vulnerability_reporting: true
    secret_scanning: true
    secret_scanning_push_protection: true
  # Own the existing main Ruleset by ID; preserve the current required-check
  # names until their separate workflow-name migration is applied.
  rulesets:
    - id: 24911852
      name: default
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include: ["~DEFAULT_BRANCH"]
          exclude: []
      bypass_actors: []
      rules:
        - type: deletion
        - type: non_fast_forward
        - type: required_linear_history
        - type: required_signatures
        - type: pull_request
          parameters:
            required_approving_review_count: 1
            dismiss_stale_reviews_on_push: true
            required_reviewers: []
            require_code_owner_review: true
            require_last_push_approval: false
            required_review_thread_resolution: true
            require_extra_approval_for_unattributed_changes: true
            allowed_merge_methods: [squash]
        - type: required_status_checks
          parameters:
            strict_required_status_checks_policy: true
            do_not_enforce_on_create: false
            required_status_checks:
              - context: pass
                integration_id: 15368
              - context: gh-settings
                integration_id: 15368
              - context: pr-message
                integration_id: 15368
