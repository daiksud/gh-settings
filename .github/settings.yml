schemaVersion: 1
settings:
  repository:
    # Omitted fields remain unmanaged.
    # Protected main provides review; the main-only Environment adds no approval.
    description: "Manage GitHub repository settings as code"
    homepage: ""
    default_branch: main
    has_issues: true
    has_projects: true
    has_wiki: true
    has_discussions: false
    web_commit_signoff_required: false
    is_template: false
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    delete_branch_on_merge: true
    allow_auto_merge: true
    allow_update_branch: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: PR_TITLE
    merge_commit_message: PR_BODY
    has_pull_requests: true
    pull_request_creation_policy: ALL
    issue_creation_policy: ALL
  topics:
    names:
      - github-cli
      - settings-as-code
  # Membership is authoritative. Historical legacy assignments were migrated
  # before removing their definitions; see docs/contributing/labels.md.
  labels:
    - name: BREAKING CHANGE
      color: b60205
      description: Incompatible CLI or public Action change; review migration guidance
    - name: DEPRECATED
      color: fbca04
      description: Supported CLI or public Action behavior marked for future removal
    - name: feat
      color: 0e8a16
      description: New capability for CLI or public Action users
    - name: fix
      color: 0052cc
      description: Correction to user-observable CLI or public Action behavior
    - name: perf
      color: 7fd18a
      description: Runtime performance improvement experienced by product users
    - name: revert
      color: 79b8ff
      description: Reverts a previous change; review the resulting product impact
    - name: docs
      color: c4b5e0
      description: Documentation or contributor and reviewer guidance
    - name: refactor
      color: 8ec9cc
      description: Implementation restructuring without user-observable behavior changes
    - name: style
      color: b5dcde
      description: Formatting changes without a behavior change
    - name: test
      color: d8ecec
      description: Test-only additions or corrections
    - name: build
      color: a8aeb4
      description: Internal build, packaging, release tooling, or dependencies
    - name: ci
      color: cfd3d7
      description: Internal CI checks or repository development automation
    - name: chore
      color: ededed
      description: Maintenance that does not fit a more specific change type
    - name: accessibility
      color: f143ab
      description: Barrier affecting people with disabilities
    - name: duplicate
      color: cfd3d7
      description: This issue or pull request already exists
    - name: good first issue
      color: 7057ff
      description: Good for newcomers
    - name: help wanted
      color: "008672"
      description: Extra attention is needed
    - name: invalid
      color: e4e669
      description: This doesn't seem right
    - name: question
      color: d876e3
      description: Further information is requested
    - name: wontfix
      color: ffffff
      description: This will not be worked on
  security:
    private_vulnerability_reporting: true
