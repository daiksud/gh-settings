documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/**
          - examples/**

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**
          - .github/scripts/**
          - .github/labeler.yml
          - action.yml
          - action/**
          - internal/actions/**
          - tests/github-actions/**
          - 'examples/github-actions/**/*.{yml,yaml}'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - go.mod
          - go.sum
          - package.json
          - bun.lock
          - .github/dependabot.yml
          - .github/workflows/actions.lock
          - .github/actions/lock-workspace-dependencies/action.yml
