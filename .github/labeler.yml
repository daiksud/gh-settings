documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/**
          - examples/**

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**
          - .github/scripts/**
          - .github/labeler*.yml
          - action.yml
          - action/**
          - internal/actions/**
          - tests/github-actions/**
          - 'examples/github-actions/**/*.{yml,yaml}'
