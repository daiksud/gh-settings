name: settings-plan
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing same-repository PR number to inspect
        required: true
        type: string
      head_sha:
        description: Expected full immutable lowercase PR head SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: settings-plan-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false
jobs:
  settings-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout PR merge without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Go
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          install_args: go
          cache: false
      - name: Validate candidate settings without remote credentials
        run: go run . validate
  activation-gate:
    if: github.event_name == 'workflow_dispatch'
    name: settings-plan-activation
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject missing activation, wrong repository or wrong branch
        env:
          ENABLED: ${{ vars.GH_SETTINGS_PLAN_ENABLED }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$ENABLED" != true || "$REPOSITORY" != daiksud/gh-settings || "$REF" != refs/heads/main ]]; then
            echo 'Protected settings plan is not activated for this main revision' >&2
            exit 1
          fi
  plan:
    needs: activation-gate
    name: settings-protected-plan
    # Activation is a separate, approved operation. No active repo variable = no job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'daiksud/gh-settings' && vars.GH_SETTINGS_PLAN_ENABLED == 'true'
    environment: gh-settings-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: read, pull-requests: read}
    steps:
      - name: Checkout trusted main policy and preparation code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Checkout the immutable published Action installer for validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: daiksud/gh-settings
          ref: e4a90d281aff8eab3f057eadcdbf609330c014a0
          path: .published
          persist-credentials: false
      - name: Install pinned Go for trusted preparation only
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          working_directory: .trusted
          install_args: go
          cache: false
      - name: Build the trusted metadata-only preparation helper
        working-directory: .trusted
        env:
          GOTOOLCHAIN: local
        run: go build -trimpath -o "$RUNNER_TEMP/pr-settings" ./scripts/pr-settings
      - name: Prepare only the pinned candidate settings blob
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          "$RUNNER_TEMP/pr-settings" prepare "$PR_NUMBER" "$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
      - name: Privately validate candidate data with the checksum-verified published CLI
        id: validation
        shell: bash
        run: |
          # Never publish untrusted YAML, parser errors, or hidden policy data.
          unset GH_TOKEN GITHUB_TOKEN GH_DEBUG
          if ! binary=$(bash "$GITHUB_WORKSPACE/.published/action/install-cli.sh" 2>/dev/null); then
            echo 'published validation binary unavailable' >&2
            exit 1
          fi
          case "$binary" in
            "$RUNNER_TEMP"/gh-settings-cli.*/gh-settings) ;;
            *) echo 'invalid published binary path' >&2; exit 1 ;;
          esac
          printf 'binary-path=%s\n' "$binary" >> "$GITHUB_OUTPUT"
          if [[ "$("$binary" --version 2>/dev/null)" != 'gh-settings v0.18.1' ]]; then
            echo 'published validation binary version mismatch' >&2
            exit 1
          fi
          if ! "$binary" validate >/dev/null 2>&1; then
            echo 'candidate settings validation failed' >&2
            exit 1
          fi
          if ! "$binary" action metadata >> "$GITHUB_OUTPUT" 2>/dev/null; then
            echo 'candidate settings metadata failed' >&2
            exit 1
          fi
      - name: Mint one repository-scoped App token after validation
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ANSWER26_CLIENT_ID }}
          private-key: ${{ secrets.ANSWER26_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - name: Read and compare declared settings
        id: observation
        shell: bash
        env:
          SETTINGS_CLI: ${{ steps.validation.outputs.binary-path }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          unset GITHUB_TOKEN GH_DEBUG
          umask 077
          if [[ ! -x "$SETTINGS_CLI" ]]; then
            echo 'published plan binary unavailable' >&2
            exit 1
          fi
          # Keep raw server diagnostics out of logs. A categorical failure may
          # write a valid report before returning nonzero; preserve that status
          # for the Summary step. An unexpected failure without a report stops.
          status=0
          "$SETTINGS_CLI" action plan "${SETTINGS_CLI%/*}/plan.json" >/dev/null 2>&1 || status=$?
          if [[ ! -f "${SETTINGS_CLI%/*}/plan.json" ]]; then
            echo 'settings observation failed' >&2
            exit 1
          fi
          printf 'exit-status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Verify that PR, merge revision and settings bytes are still current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          "$RUNNER_TEMP/pr-settings" verify "$PR_NUMBER" "$EXPECTED_HEAD" > /dev/null
      - name: Publish the fresh declared-only result
        shell: bash
        env:
          SETTINGS_CLI: ${{ steps.validation.outputs.binary-path }}
          SETTINGS_ACTOR: ${{ github.actor }}
          SETTINGS_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SETTINGS_EVENT: ${{ github.event_name }}
          SETTINGS_RUN_ID: ${{ github.run_id }}
          SETTINGS_RUN_ATTEMPT: ${{ github.run_attempt }}
          SETTINGS_WORKFLOW_REF: ${{ github.workflow_ref }}
          SETTINGS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SETTINGS_ACTION_REPOSITORY: daiksud/gh-settings
          SETTINGS_ACTION_REF: e4a90d281aff8eab3f057eadcdbf609330c014a0
          SETTINGS_CONFIG_SHA: ${{ steps.validation.outputs.config-sha }}
          SETTINGS_TARGET: ${{ steps.validation.outputs.target }}
          SETTINGS_CLI_VERSION: ${{ steps.validation.outputs.cli-version }}
          SETTINGS_CLI_SHA256: ${{ steps.validation.outputs.cli-sha256 }}
          PLAN_STATUS: ${{ steps.observation.outputs.exit-status }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head-sha }}
          BASE_SHA: ${{ steps.candidate.outputs.base-sha }}
          CONFIG_SHA256: ${{ steps.candidate.outputs.config-sha256 }}
        run: |
          unset GH_TOKEN GITHUB_TOKEN GH_DEBUG
          {
            printf '\n\n## Protected settings observation\n\n'
            printf 'Pull request: #%s  \n' "$PR_NUMBER"
            printf 'Expected head: <code>%s</code>  \n' "$HEAD_SHA"
            printf 'Observed base: <code>%s</code>  \n' "$BASE_SHA"
            printf 'Prepared merge/configuration: <code>%s</code>  \n' "$SETTINGS_CONFIG_SHA"
            printf 'Configuration SHA-256: <code>%s</code>\n' "$CONFIG_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
          summary_status=0
          "$SETTINGS_CLI" action summary "${SETTINGS_CLI%/*}/plan.json" "$GITHUB_STEP_SUMMARY" >/dev/null 2>&1 || summary_status=$?
          if [[ "$PLAN_STATUS" != 0 ]]; then
            echo 'settings observation report failed' >&2
            exit "${PLAN_STATUS:-1}"
          fi
          if [[ "$summary_status" != 0 ]]; then
            echo 'settings observation report failed' >&2
            exit "$summary_status"
          fi
      - name: Remove private candidate, plan report, and CLI on ordinary exit
        if: always()
        env:
          VALIDATION_CLI: ${{ steps.validation.outputs.binary-path }}
        run: |
          rm -f -- "$RUNNER_TEMP/pr-settings"
          rm -rf -- "$GITHUB_WORKSPACE/.git" "$GITHUB_WORKSPACE/.github"
          if [[ -n "$VALIDATION_CLI" ]]; then
            case "$VALIDATION_CLI" in
              "$RUNNER_TEMP"/gh-settings-cli.*/gh-settings) rm -rf -- "${VALIDATION_CLI%/*}" ;;
              *) echo 'invalid private plan cleanup path' >&2; exit 1 ;;
            esac
          fi
