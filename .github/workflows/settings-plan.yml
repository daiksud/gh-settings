name: settings-plan
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
permissions: {}
concurrency:
  group: settings-plan-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  settings-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout PR merge without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Go
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8
          install_args: go
          cache: false
      - name: Validate candidate settings without remote credentials
        run: go run . validate
