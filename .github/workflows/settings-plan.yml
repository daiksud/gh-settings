name: settings-plan
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
permissions: {}
concurrency:
  group: settings-plan-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  settings-plan:
    if: github.event_name == 'pull_request'
    # The pinned public Action requires a fresh Ubuntu 24.04 x64 VM, not a container.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout PR merge without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate operational settings with their pinned consumer
        uses: daiksud/gh-settings@cbc112ae1330b4ad4debe013857bd67d2e1a1e1e # v0.23.0
        with:
          command: validate
