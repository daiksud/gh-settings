name: pr
on:
  pull_request:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screening:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Inventory dependencies without changing workspace Action execution.
      - name: Lock dependencies of workspace Actions
        if: ${{ false }}
        uses: $/.github/actions/lock-workspace-dependencies-screening
      - name: Set up pinned build tools
        uses: ./.github/actions/setup-tools
      - name: Prepare generated files for this refactor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/github/gh-actions-lock/releases/download/v0.4.1/linux-amd64 --output "$RUNNER_TEMP/gh-actions-lock"
          printf '%s  %s\n' '39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e' "$RUNNER_TEMP/gh-actions-lock" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/gh-actions-lock"
          python3 - <<'PREPARE_PY'
          from pathlib import Path
          p = Path('.github/workflows/pr.yml')
          if not p.exists():
              p = Path('.github/workflows/ci-pr.yml')
          s = p.read_text()
          start = s.index('      - name: Prepare generated files for this refactor')
          end = s.index('      - name: Restore Go compilation and modules\n', start)
          Path('.github/workflows/pr.yml').write_text(s[:start] + s[end:])
          if p.name != 'pr.yml':
              p.unlink()
          PREPARE_PY
          "$RUNNER_TEMP/gh-actions-lock" --no-interactive --no-narrow --ignore-local-actions
          "$RUNNER_TEMP/gh-actions-lock" --verify --no-narrow --ignore-local-actions
          python3 - <<'GENERATED_PY'
          import base64
          import subprocess
          from pathlib import Path
          for name in ['actions_lockfile_test.go', 'candidate_workflow_test.go', 'ci_artifacts_test.go', 'go_cache_test.go', 'managed_settings_test.go', 'pr_code_gate_test.go', 'settings_environment_scope_test.go', 'workflow_lint_test.go']:
              p = Path('tests/github-actions') / name
              before = p.read_bytes()
              subprocess.run(['gofmt', '-w', str(p)], check=True)
              if p.read_bytes() != before:
                  print('GENERATED_FILE:' + str(p) + ':' + base64.b64encode(p.read_bytes()).decode())
          p = Path('.github/workflows/actions.lock')
          print('GENERATED_FILE:' + str(p) + ':' + base64.b64encode(p.read_bytes()).decode())
          GENERATED_PY
      - name: Restore Go compilation and modules
        id: go-cache
        uses: ./.github/actions/restore-go-cache
      - name: Lint source and workflows
        uses: ./.github/actions/lint
      - name: Run unit tests
        uses: ./.github/actions/unit-test
      - name: Build executable
        uses: ./.github/actions/build
      - name: Save Go compilation and modules after successful checks
        uses: ./.github/actions/save-go-cache
        with:
          build-path: ${{ steps.go-cache.outputs.build-path }}
          module-path: ${{ steps.go-cache.outputs.module-path }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          cache-primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}
