name: ci-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: &pr-env
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Set draft state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
  commitlint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install message validation tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          install_args: bun npm:@commitlint/cli
          cache: false
      - name: Test PR message policy
        run: bash tests/github-actions/commitlint.sh
      - name: Validate PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" |
            mise exec -- bun run --bun --no-install "$(mise which commitlint)" --strict
  commit-stage:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 12
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    outputs:
      binary-sha256: ${{ steps.validation.outputs.binary-sha256 }}
      source-sha: ${{ steps.validation.outputs.source-sha }}
      cli-version: ${{ steps.validation.outputs.cli-version }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit stage
        id: validation
        uses: ./.github/actions/commit-stage
      - name: Transfer the built binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-settings
          path: ${{ steps.validation.outputs.binary-path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  ready:
    needs: commit-stage
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: *pr-env
    steps:
      - name: Set ready state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
  acceptance-stage:
    needs: [commit-stage, ready]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit-stage.outputs.source-sha }}
          persist-credentials: false
      - name: Retrieve this run's product binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-settings
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Acceptance stage
        uses: ./.github/actions/acceptance-stage
        with:
          binary-path: ${{ runner.temp }}/product/gh-settings
          binary-sha256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          version: ${{ needs.commit-stage.outputs.cli-version }}
  composite-smoke:
    needs: [commit-stage, ready]
    # Exercise the public Action's supported runner, independently of ubuntu-slim CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Checkout the Action under test separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit-stage.outputs.source-sha }}
          path: .action
          persist-credentials: false
      - name: Install Go for the local API fixture only
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          working_directory: .action
          install_args: go
          cache: false
      - name: Retrieve this run's candidate binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-settings
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Validate the producer candidate through the public Action
        uses: ./.action/.github/actions/candidate-smoke
        with:
          source-sha: ${{ needs.commit-stage.outputs.source-sha }}
          cli-version: ${{ needs.commit-stage.outputs.cli-version }}
          binary-sha256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          binary-path: ${{ runner.temp }}/product/gh-settings
  pass:
    needs: [commitlint, acceptance-stage, composite-smoke]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Reject failed or cancelled validation
        if: cancelled() || needs.commitlint.result != 'success' || needs['acceptance-stage'].result != 'success' || needs['composite-smoke'].result != 'success'
        run: exit 1
