name: ci-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  # Metadata edits must not cancel an in-flight validation of the code.
  group: ci-pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'code' }}
  cancel-in-progress: true
jobs:
  code-start:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {statuses: write}
    steps:
      - name: Mark this code revision pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context=pass \
            -f description='Code validation is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  draft:
    needs: code-start
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: &pr-env
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Set draft state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
  commit-stage:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 12
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    outputs:
      binary-sha256: ${{ steps.validation.outputs.binary-sha256 }}
      source-sha: ${{ steps.validation.outputs.source-sha }}
      cli-version: ${{ steps.validation.outputs.cli-version }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit stage
        id: validation
        uses: ./.github/actions/commit-stage
      - name: Transfer the built binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-settings
          path: ${{ steps.validation.outputs.binary-path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  ready:
    needs: commit-stage
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: *pr-env
    steps:
      - name: Set ready state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
  acceptance-stage:
    needs: [commit-stage, ready]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit-stage.outputs.source-sha }}
          persist-credentials: false
      - name: Retrieve this run's product binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-settings
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Acceptance stage
        uses: ./.github/actions/acceptance-stage
        with:
          binary-path: ${{ runner.temp }}/product/gh-settings
          binary-sha256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          version: ${{ needs.commit-stage.outputs.cli-version }}
  composite-smoke:
    needs: [commit-stage, ready]
    # Exercise the public Action's supported runner, independently of ubuntu-slim CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Checkout the Action under test separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit-stage.outputs.source-sha }}
          path: .action
          persist-credentials: false
      - name: Install Go for the local API fixture only
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          working_directory: .action
          install_args: go
          cache: false
      - name: Retrieve this run's candidate binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-settings
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Validate the producer candidate through the public Action
        uses: ./.action/.github/actions/candidate-smoke
        with:
          source-sha: ${{ needs.commit-stage.outputs.source-sha }}
          cli-version: ${{ needs.commit-stage.outputs.cli-version }}
          binary-sha256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          binary-path: ${{ runner.temp }}/product/gh-settings
  code-result:
    needs: [code-start, draft, commit-stage, ready, acceptance-stage, composite-smoke]
    # Do not let always() continue reporting success after workflow cancellation.
    if: always() && !cancelled() && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {statuses: write, pull-requests: read}
    steps:
      # No checkout or candidate artifact: publish only the actual prerequisite results.
      # A skipped metadata-only run never emits a new required pass status.
      - name: Publish the code result without replacing newer revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RESULTS: ${{ toJSON(needs) }}
          WAS_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg ref "$BASE_REF" \
            '.head.sha == $head and .base.sha == $base and .base.ref == $ref' <<< "$current" > /dev/null; then
            echo 'The PR revision or base changed; do not overwrite its newer code result.' >&2
            exit 1
          fi
          state=failure
          description='Code validation did not succeed'
          if [[ "$WAS_CANCELLED" == false ]] && jq -e 'length == 6 and all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null; then
            encoded_base="$(jq -rn --arg ref "$BASE_REF" '$ref | @uri')"
            rules="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/rules/branches/$encoded_base")"
            if jq -e 'add | any(.[]; .type == "required_status_checks" and any(.parameters.required_status_checks[]?; .context == "pr-message" and .integration_id == 15368))' <<< "$rules" > /dev/null; then
              state=success
              description='Code validation passed; message validation is required separately'
            else
              description='Require pr-message from GitHub Actions before activating split CI'
              echo "$description" >&2
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=pass -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$state" == success ]]
