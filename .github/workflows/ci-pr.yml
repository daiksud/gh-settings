name: ci-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: &pr-env
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Set draft state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
  commit-stage:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 12
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    outputs:
      binary-sha256: ${{ steps.validation.outputs.binary-sha256 }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit stage
        id: validation
        uses: ./.github/actions/commit-stage
      - name: Transfer the built binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-settings
          path: ${{ steps.validation.outputs.binary-path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  ready:
    needs: commit-stage
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: *pr-env
    steps:
      - name: Set ready state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
  acceptance-stage:
    needs: [commit-stage, ready]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve this run's product binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-settings
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Acceptance stage
        uses: ./.github/actions/acceptance-stage
        with:
          binary-path: ${{ runner.temp }}/product/gh-settings
          binary-sha256: ${{ needs.commit-stage.outputs.binary-sha256 }}
  pass:
    needs: acceptance-stage
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Reject failed or cancelled validation
        if: cancelled() || needs['acceptance-stage'].result != 'success'
        run: exit 1
