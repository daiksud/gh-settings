name: ci-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: &pr-env
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Set draft state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
  commit-stage:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 12
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    outputs:
      binary-sha256: ${{ steps.validation.outputs.binary-sha256 }}
      source-sha: ${{ steps.validation.outputs.source-sha }}
      cli-version: ${{ steps.validation.outputs.cli-version }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit stage
        id: validation
        uses: ./.github/actions/commit-stage
      - name: Transfer the built binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-settings
          path: ${{ steps.validation.outputs.binary-path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  ready:
    needs: commit-stage
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    env: *pr-env
    steps:
      - name: Set ready state
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
  acceptance-stage:
    needs: [commit-stage, ready]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit-stage.outputs.source-sha }}
          persist-credentials: false
      - name: Retrieve this run's product binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-settings
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Acceptance stage
        uses: ./.github/actions/acceptance-stage
        with:
          binary-path: ${{ runner.temp }}/product/gh-settings
          binary-sha256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          version: ${{ needs.commit-stage.outputs.cli-version }}
  composite-smoke:
    needs: [commit-stage, ready]
    # Exercise the public Action's supported runner, independently of ubuntu-slim CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Checkout the Action under test separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit-stage.outputs.source-sha }}
          path: .action
          persist-credentials: false
      - name: Install Go for the local API fixture only
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          working_directory: .action
          install_args: go
          cache: false
      - name: Retrieve this run's candidate binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-settings
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Prepare the bounded candidate download fixture
        env:
          BINARY_PATH: ${{ runner.temp }}/product/gh-settings
          EXPECTED_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          SOURCE_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          bash .action/tests/github-actions/prepare-candidate-download.sh \
            "$BINARY_PATH" "$EXPECTED_SHA256" "$SOURCE_SHA" "$CLI_VERSION"
      - name: Create a configuration-only consumer checkout
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          [[ ! -e .git && ! -e action.yml && ! -e action ]]
          mkdir -p .github
          printf 'schemaVersion: 1\nsettings:\n  repository:\n    description: Hosted composite fixture\n' > .github/settings.yml
          git init --quiet
          git remote add origin https://github.com/example-owner/settings-fixture.git
          git add .github/settings.yml
          git -c commit.gpgsign=false -c user.name=Fixture -c user.email=fixture@example.invalid commit --quiet -m 'test: initialize consumer fixture'
          [[ "$(git rev-parse --show-toplevel)" != "$(git -C .action rev-parse --show-toplevel)" ]]
      - name: Validate through the actual root composite
        id: validate
        uses: ./.action
        with:
          command: validate
      - name: Assert consumer identity and all public outputs
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          CONFIG_SHA: ${{ steps.validate.outputs.config-sha }}
          TARGET: ${{ steps.validate.outputs.target }}
          CLI_VERSION: ${{ steps.validate.outputs.cli-version }}
          CLI_SHA256: ${{ steps.validate.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          [[ ! -e action.yml && ! -e action ]]
          [[ "$(git ls-files)" == .github/settings.yml ]]
          [[ "$(git -C .action rev-parse HEAD)" == "$ACTION_SHA" ]]
          [[ "$CONFIG_SHA" == "$(git rev-parse HEAD)" && "$CONFIG_SHA" != "$ACTION_SHA" ]]
          [[ "$TARGET" == example-owner/settings-fixture ]]
          [[ "$CLI_VERSION" == "$EXPECTED_CLI_VERSION" ]]
          [[ "$CLI_SHA256" == "$EXPECTED_CLI_SHA256" ]]
          printf 'Action checkout: %s at %s\nConsumer checkout: %s at %s\n' \
            "$(git -C .action rev-parse --show-toplevel)" "$ACTION_SHA" \
            "$(git rev-parse --show-toplevel)" "$CONFIG_SHA"
          printf 'target=%s\ncli-version=%s\ncli-sha256=%s\n' "$TARGET" "$CLI_VERSION" "$CLI_SHA256"
      - name: Build and start the required local repository API
        env:
          GOTOOLCHAIN: local
        run: |
          (cd .action && go build -o "$RUNNER_TEMP/plan-fixture" ./tests/github-actions/plan-fixture)
          bash .action/tests/github-actions/candidate-plan.sh start "$RUNNER_TEMP/plan-fixture"
      - name: Prepare the changed plan and Summary snapshot
        run: bash .action/tests/github-actions/candidate-plan.sh prepare
      - name: Plan through the actual root composite
        id: plan
        uses: ./.action
        with:
          command: plan
          token: plan-fixture-read
      - name: Assert actual plan and Summary bytes
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          CONFIG_SHA: ${{ steps.plan.outputs.config-sha }}
          TARGET: ${{ steps.plan.outputs.target }}
          CLI_VERSION: ${{ steps.plan.outputs.cli-version }}
          CLI_SHA256: ${{ steps.plan.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: bash .action/tests/github-actions/candidate-plan.sh assert
      - name: Prepare the repository read failure
        run: bash .action/tests/github-actions/candidate-plan.sh prepare read-failure
      - name: Plan through an actual local read403
        id: read-failure
        continue-on-error: true
        uses: ./.action
        with:
          command: plan
          token: plan-fixture-read
      - name: Require read failure and diagnostic Summary
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          PLAN_OUTCOME: ${{ steps.read-failure.outcome }}
          CONFIG_SHA: ${{ steps.read-failure.outputs.config-sha }}
          TARGET: ${{ steps.read-failure.outputs.target }}
          CLI_VERSION: ${{ steps.read-failure.outputs.cli-version }}
          CLI_SHA256: ${{ steps.read-failure.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: bash .action/tests/github-actions/candidate-plan.sh assert read-failure
      - name: Prepare the committed invalid configuration
        run: bash .action/tests/github-actions/candidate-plan.sh prepare invalid-config
      - name: Plan through an actual configuration failure
        id: invalid-config
        continue-on-error: true
        uses: ./.action
        with:
          command: plan
          token: plan-fixture-read
      - name: Require config failure without API access
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          PLAN_OUTCOME: ${{ steps.invalid-config.outcome }}
          CONFIG_SHA: ${{ steps.invalid-config.outputs.config-sha }}
          TARGET: ${{ steps.invalid-config.outputs.target }}
          CLI_VERSION: ${{ steps.invalid-config.outputs.cli-version }}
          CLI_SHA256: ${{ steps.invalid-config.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: bash .action/tests/github-actions/candidate-plan.sh assert invalid-config
      - name: Prepare the direct apply declaration and Summary snapshot
        run: bash .action/tests/github-actions/candidate-plan.sh prepare apply
      - name: Apply through the actual root composite
        id: apply
        uses: ./.action
        with:
          command: apply
          token: apply-fixture-write
      - name: Require exact direct PATCH and all public outputs
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          PLAN_OUTCOME: ${{ steps.apply.outcome }}
          CONFIG_SHA: ${{ steps.apply.outputs.config-sha }}
          TARGET: ${{ steps.apply.outputs.target }}
          CLI_VERSION: ${{ steps.apply.outputs.cli-version }}
          CLI_SHA256: ${{ steps.apply.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: bash .action/tests/github-actions/candidate-plan.sh assert apply
      - name: Prepare the local write failure
        run: bash .action/tests/github-actions/candidate-plan.sh prepare apply-write-failure
      - name: Apply through an actual local write403
        id: write-failure
        continue-on-error: true
        uses: ./.action
        with:
          command: apply
          token: apply-fixture-write
      - name: Require write failure and four empty outputs
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          PLAN_OUTCOME: ${{ steps.write-failure.outcome }}
          CONFIG_SHA: ${{ steps.write-failure.outputs.config-sha }}
          TARGET: ${{ steps.write-failure.outputs.target }}
          CLI_VERSION: ${{ steps.write-failure.outputs.cli-version }}
          CLI_SHA256: ${{ steps.write-failure.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: bash .action/tests/github-actions/candidate-plan.sh assert apply-write-failure
      - name: Prepare the invalid apply declaration
        run: bash .action/tests/github-actions/candidate-plan.sh prepare apply-invalid
      - name: Apply through an actual configuration failure
        id: apply-invalid
        continue-on-error: true
        uses: ./.action
        with:
          command: apply
          token: apply-fixture-write
      - name: Require invalid apply failure without API access
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          PLAN_OUTCOME: ${{ steps.apply-invalid.outcome }}
          CONFIG_SHA: ${{ steps.apply-invalid.outputs.config-sha }}
          TARGET: ${{ steps.apply-invalid.outputs.target }}
          CLI_VERSION: ${{ steps.apply-invalid.outputs.cli-version }}
          CLI_SHA256: ${{ steps.apply-invalid.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: bash .action/tests/github-actions/candidate-plan.sh assert apply-invalid
      - name: Prepare the empty apply declaration
        run: bash .action/tests/github-actions/candidate-plan.sh prepare apply-empty
      - name: Apply an actual empty declaration
        id: apply-empty
        uses: ./.action
        with:
          command: apply
          token: apply-fixture-write
      - name: Require successful empty apply without API access
        env:
          ACTION_SHA: ${{ needs.commit-stage.outputs.source-sha }}
          PLAN_OUTCOME: ${{ steps.apply-empty.outcome }}
          CONFIG_SHA: ${{ steps.apply-empty.outputs.config-sha }}
          TARGET: ${{ steps.apply-empty.outputs.target }}
          CLI_VERSION: ${{ steps.apply-empty.outputs.cli-version }}
          CLI_SHA256: ${{ steps.apply-empty.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ needs.commit-stage.outputs.cli-version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: bash .action/tests/github-actions/candidate-plan.sh assert apply-empty
      - name: Stop the owned local repository API
        if: always()
        run: bash .action/tests/github-actions/candidate-plan.sh stop
  pass:
    needs: [acceptance-stage, composite-smoke]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Reject failed or cancelled validation
        if: cancelled() || needs['acceptance-stage'].result != 'success' || needs['composite-smoke'].result != 'success'
        run: exit 1
