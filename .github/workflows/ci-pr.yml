name: ci-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    steps:
      - name: Set draft state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
  resolve:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      build-matrix: ${{ steps.metadata.outputs.build-matrix }}
      acceptance-matrix: ${{ steps.metadata.outputs.acceptance-matrix }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Inventory dependencies without changing workspace Action execution.
      - name: Lock dependencies of workspace Actions
        if: ${{ false }}
        uses: $/.github/actions/lock-workspace-dependencies-screening
      - name: Resolve CI target matrices
        id: metadata
        uses: ./.github/actions/ci-metadata
  commit-stage:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run Screening checks and build candidate
        uses: ./.github/actions/commit-stage
        with:
          cache-go: 'true'
  ready:
    needs: commit-stage
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    steps:
      - name: Set ready state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
  ci-pr:
    needs: [draft, resolve, commit-stage, ready]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require every validation stage to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'length == 4 and all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
