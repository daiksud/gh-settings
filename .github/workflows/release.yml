name: release
on:
  workflow_dispatch:
    inputs:
      promote_to_v1:
        description: Promote to v1 (initial v0-to-v1 release is v1.0.1)
        required: false
        type: boolean
        default: false
      source_sha:
        description: Optional immutable main commit to require (for reviewed dispatch)
        required: false
        type: string
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  # Serialize publication without cancelling an active release; ordering is not FIFO.
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read, actions: read}
    outputs:
      ci-run-id: ${{ steps.ci.outputs.ci-run-id }}
      version: ${{ steps.metadata.outputs.version }}
      previous-tag: ${{ steps.metadata.outputs.previous-tag }}
      previous-sha: ${{ steps.metadata.outputs.previous-sha }}
      release-needed: ${{ steps.metadata.outputs.release-needed }}
      ci-run-attempt: ${{ steps.ci.outputs.ci-run-attempt }}
      reused: ${{ steps.reuse.outputs.reused }}
      linux-id: ${{ steps.reuse.outputs.linux-id }}
      macos-id: ${{ steps.reuse.outputs.macos-id }}
    steps:
      - name: Require a main-branch dispatch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          [[ "$SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'release must be dispatched from main' >&2; exit 1
          }
      - name: Require the dispatched main commit to remain current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_main" == "$SOURCE_SHA" ]] || {
            echo 'main moved since dispatch; start a new release workflow' >&2; exit 1
          }
      - name: Validate the optional reviewed source pin
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'invalid source_sha (expected full 40-character SHA)' >&2; exit 1
            }
            [[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]] || {
              echo 'dispatched main differs from approved source_sha; refusing a different release source' >&2; exit 1
            }
          fi
      - name: Checkout frozen main and complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Lock the nested Actions used to publish and verify the selected artifacts.
      - name: Inventory publication dependencies
        if: ${{ false }}
        uses: $/.github/actions/release-publish
      - name: Calculate the version for the frozen main commit
        id: metadata
        uses: ./.github/actions/release-metadata
        with:
          source-sha: ${{ github.sha }}
          promote-to-v1: ${{ inputs.promote_to_v1 }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the latest main validation
        id: ci
        if: steps.metadata.outputs.release-needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release-ci.py status
      - name: Select reusable inspected artifacts
        id: reuse
        if: steps.metadata.outputs.release-needed == 'true'
        uses: ./.github/actions/release-reuse
        with:
          source-sha: ${{ github.sha }}
          version: ${{ steps.metadata.outputs.version }}
          ci-run-id: ${{ steps.ci.outputs.ci-run-id }}
          ci-run-attempt: ${{ steps.ci.outputs.ci-run-attempt }}
  candidate:
    needs: resolve
    if: needs.resolve.outputs.release-needed == 'true' && needs.resolve.outputs.reused == 'false'
    permissions: {contents: read}
    uses: ./.github/workflows/candidate.yml
    with:
      source-sha: ${{ github.sha }}
      version: ${{ needs.resolve.outputs.version }}
  select:
    needs: [resolve, candidate]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.release-needed == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    outputs:
      run-id: ${{ steps.artifacts.outputs.run-id }}
      linux-id: ${{ steps.artifacts.outputs.linux-id }}
      macos-id: ${{ steps.artifacts.outputs.macos-id }}
    steps:
      - name: Select the accepted artifacts from exactly one producer
        id: artifacts
        env:
          REUSED: ${{ needs.resolve.outputs.reused }}
          CANDIDATE: ${{ needs.candidate.result }}
          PUSH_RUN: ${{ needs.resolve.outputs.ci-run-id }}
          PUSH_LINUX: ${{ needs.resolve.outputs.linux-id }}
          PUSH_MACOS: ${{ needs.resolve.outputs.macos-id }}
          FRESH_LINUX: ${{ needs.candidate.outputs.linux-id }}
          FRESH_MACOS: ${{ needs.candidate.outputs.macos-id }}
        run: |
          case "$REUSED/$CANDIDATE" in
            true/skipped) run=$PUSH_RUN; linux=$PUSH_LINUX; macos=$PUSH_MACOS ;;
            false/success) run=$GITHUB_RUN_ID; linux=$FRESH_LINUX; macos=$FRESH_MACOS ;;
            *) echo 'No accepted set of release artifacts' >&2; exit 1 ;;
          esac
          for id in "$run" "$linux" "$macos"; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
          done
          [[ "$linux" != "$macos" ]] || exit 1
          printf 'run-id=%s\nlinux-id=%s\nmacos-id=%s\n' "$run" "$linux" "$macos" >> "$GITHUB_OUTPUT"
  release:
    needs: [resolve, select]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.select.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - name: Checkout frozen main and complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck main and the selected push attempt before publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_RUN: ${{ needs.resolve.outputs.ci-run-id }}
          EXPECTED_ATTEMPT: ${{ needs.resolve.outputs.ci-run-attempt }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$SOURCE_SHA" ]] || {
            echo 'main advanced during release; abort publication' >&2
            exit 1
          }
          python3 .github/scripts/release-ci.py status "$EXPECTED_RUN" "$EXPECTED_ATTEMPT"
      - name: Publish accepted release artifacts
        uses: ./.github/actions/release-publish
        with:
          source-sha: ${{ github.sha }}
          version: ${{ needs.resolve.outputs.version }}
          previous-tag: ${{ needs.resolve.outputs.previous-tag }}
          previous-sha: ${{ needs.resolve.outputs.previous-sha }}
          run-id: ${{ needs.select.outputs.run-id }}
          linux-artifact-id: ${{ needs.select.outputs.linux-id }}
          macos-artifact-id: ${{ needs.select.outputs.macos-id }}
  verify-release:
    needs: [resolve, select, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, actions: read}
    steps:
      - name: Checkout frozen verification source separately from the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .action
          persist-credentials: false
      - name: Verify immutable published release
        uses: ./.action/.github/actions/release-verify
        with:
          source-sha: ${{ github.sha }}
          version: ${{ needs.resolve.outputs.version }}
          run-id: ${{ needs.select.outputs.run-id }}
          linux-artifact-id: ${{ needs.select.outputs.linux-id }}
          macos-artifact-id: ${{ needs.select.outputs.macos-id }}
