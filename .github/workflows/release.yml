name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_sha:
        description: Optional immutable main commit to require (for reviewed dispatch)
        required: false
        type: string
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: read}
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Validate version and freeze latest main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'invalid source_sha (expected full 40-character SHA)' >&2; exit 1
            }
            [[ "$sha" == "$EXPECTED_SOURCE_SHA" ]] || {
              echo 'main moved since approved source_sha; refusing a different release source' >&2; exit 1
            }
          fi
          printf 'source-sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
  commit-stage:
    needs: resolve
    runs-on: ubuntu-slim
    timeout-minutes: 12
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    outputs:
      binary-sha256: ${{ steps.validation.outputs.binary-sha256 }}
    steps:
      - name: Checkout frozen main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source-sha }}
          persist-credentials: false
      - name: Require the committed CLI version to match the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$(cat action/cli-version)" == "$VERSION" ]] || {
            echo 'release version differs from committed CLI version' >&2; exit 1
          }
      - name: Commit stage and Linux release build
        id: validation
        uses: ./.github/actions/commit-stage
        with:
          binary-name: gh-settings-linux-amd64
          version: ${{ inputs.version }}
      - name: Transfer Linux binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-amd64
          path: ${{ steps.validation.outputs.binary-path }}
          if-no-files-found: error
          retention-days: 1
  build-macos:
    needs: [resolve, commit-stage]
    runs-on: macos-15
    timeout-minutes: 12
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    outputs:
      binary-sha256: ${{ steps.build.outputs.binary-sha256 }}
    steps:
      - name: Checkout frozen main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source-sha }}
          persist-credentials: false
      - name: Install Go
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          install_args: go
          cache: false
      - name: Build macOS binary once
        id: build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$(go env GOOS GOARCH)" == $'darwin\narm64' ]]
          go build -trimpath -ldflags "-X main.version=$VERSION" -o "$RUNNER_TEMP/gh-settings-darwin-arm64" .
          printf 'binary-sha256=%s\n' "$(shasum -a 256 "$RUNNER_TEMP/gh-settings-darwin-arm64" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Transfer macOS binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-darwin-arm64
          path: ${{ runner.temp }}/gh-settings-darwin-arm64
          if-no-files-found: error
          retention-days: 1
  acceptance-linux:
    needs: [resolve, commit-stage]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout frozen main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source-sha }}
          persist-credentials: false
      - name: Retrieve Linux binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-amd64
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Acceptance stage
        uses: ./.github/actions/acceptance-stage
        with:
          binary-path: ${{ runner.temp }}/product/gh-settings-linux-amd64
          binary-sha256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          version: ${{ inputs.version }}
  acceptance-macos:
    needs: [resolve, build-macos]
    runs-on: macos-15
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout frozen main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source-sha }}
          persist-credentials: false
      - name: Retrieve macOS binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-darwin-arm64
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Acceptance stage
        uses: ./.github/actions/acceptance-stage
        with:
          binary-path: ${{ runner.temp }}/product/gh-settings-darwin-arm64
          binary-sha256: ${{ needs.build-macos.outputs.binary-sha256 }}
          version: ${{ inputs.version }}
  candidate-action-smoke:
    needs: [resolve, commit-stage]
    # Validate the frozen candidate on the public Action's supported runner before publication.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Checkout the Action under test separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source-sha }}
          path: .action
          persist-credentials: false
      - name: Retrieve this run's candidate binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-amd64
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Prepare the bounded candidate download fixture
        id: download-fixture
        env:
          BINARY_PATH: ${{ runner.temp }}/product/gh-settings-linux-amd64
          EXPECTED_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
          CLI_VERSION: ${{ inputs.version }}
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          bash .action/tests/github-actions/prepare-candidate-download.sh \
            "$BINARY_PATH" "$EXPECTED_SHA256" "$SOURCE_SHA" "$CLI_VERSION"
      - name: Create a configuration-only consumer checkout
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          [[ ! -e .git && ! -e action.yml && ! -e action ]]
          mkdir -p .github
          printf 'schemaVersion: 1\nsettings:\n  repository:\n    description: Hosted composite fixture\n' > .github/settings.yml
          git init --quiet
          git remote add origin https://github.com/example-owner/settings-fixture.git
          git add .github/settings.yml
          git -c commit.gpgsign=false -c user.name=Fixture -c user.email=fixture@example.invalid commit --quiet -m 'test: initialize consumer fixture'
          [[ "$(git rev-parse --show-toplevel)" != "$(git -C .action rev-parse --show-toplevel)" ]]
      - name: Validate through the actual root composite
        id: validate
        uses: ./.action
        with:
          command: validate
      - name: Assert consumer identity and all public outputs
        id: identity
        env:
          ACTION_SHA: ${{ needs.resolve.outputs.source-sha }}
          CONFIG_SHA: ${{ steps.validate.outputs.config-sha }}
          TARGET: ${{ steps.validate.outputs.target }}
          CLI_VERSION: ${{ steps.validate.outputs.cli-version }}
          CLI_SHA256: ${{ steps.validate.outputs.cli-sha256 }}
          EXPECTED_CLI_VERSION: ${{ inputs.version }}
          EXPECTED_CLI_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          [[ ! -e action.yml && ! -e action ]]
          [[ "$(git ls-files)" == .github/settings.yml ]]
          [[ "$(git -C .action rev-parse HEAD)" == "$ACTION_SHA" ]]
          [[ "$CONFIG_SHA" == "$(git rev-parse HEAD)" && "$CONFIG_SHA" != "$ACTION_SHA" ]]
          [[ "$TARGET" == example-owner/settings-fixture ]]
          [[ "$CLI_VERSION" == "$EXPECTED_CLI_VERSION" ]]
          [[ "$CLI_SHA256" == "$EXPECTED_CLI_SHA256" ]]
          printf 'Action checkout: %s at %s\nConsumer checkout: %s at %s\n' \
            "$(git -C .action rev-parse --show-toplevel)" "$ACTION_SHA" \
            "$(git rev-parse --show-toplevel)" "$CONFIG_SHA"
          printf 'target=%s\ncli-version=%s\ncli-sha256=%s\n' "$TARGET" "$CLI_VERSION" "$CLI_SHA256"
  publish:
    needs: [resolve, commit-stage, build-macos, acceptance-linux, acceptance-macos, candidate-action-smoke]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {contents: write}
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout frozen main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve Linux binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-amd64
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Retrieve macOS binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-darwin-arm64
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Install pinned release tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          install_args: go
          cache: false
      - name: Verify, stage, and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
          LINUX_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          MACOS_SHA256: ${{ needs.build-macos.outputs.binary-sha256 }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: bash scripts/publish-release.sh
  published-action-smoke:
    needs: [resolve, commit-stage, publish]
    # Validate the published Action on its supported runner after immutable publication.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Checkout the published Action tag separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          path: .action
          persist-credentials: false
      - name: Verify the published tag matches the accepted source
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          [[ "$(git -C .action rev-parse HEAD)" == "$SOURCE_SHA" ]] || {
            echo 'published tag differs from accepted source' >&2; exit 1
          }
          [[ "$(cat .action/action/cli-version)" == "$RELEASE_VERSION" ]] || {
            echo 'published Action version differs from release' >&2; exit 1
          }
      - name: Create a configuration-only consumer checkout
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          [[ ! -e .git && ! -e action.yml && ! -e action ]]
          mkdir -p .github
          printf 'schemaVersion: 1\nsettings:\n  repository:\n    description: Hosted composite fixture\n' > .github/settings.yml
          git init --quiet
          git remote add origin https://github.com/example-owner/settings-fixture.git
          git add .github/settings.yml
          git -c commit.gpgsign=false -c user.name=Fixture -c user.email=fixture@example.invalid commit --quiet -m 'test: initialize consumer fixture'
          [[ "$(git rev-parse --show-toplevel)" != "$(git -C .action rev-parse --show-toplevel)" ]]
      - name: Validate through the published root composite
        id: validate
        uses: ./.action
        with:
          command: validate
      - name: Assert consumer identity and all public outputs
        env:
          ACTION_SHA: ${{ needs.resolve.outputs.source-sha }}
          CONFIG_SHA: ${{ steps.validate.outputs.config-sha }}
          TARGET: ${{ steps.validate.outputs.target }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ needs.commit-stage.outputs.binary-sha256 }}
          CLI_VERSION: ${{ steps.validate.outputs.cli-version }}
          CLI_SHA256: ${{ steps.validate.outputs.cli-sha256 }}
        run: |
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} ]]
          [[ ! -e action.yml && ! -e action ]]
          [[ "$(git ls-files)" == .github/settings.yml ]]
          [[ "$(git -C .action rev-parse HEAD)" == "$ACTION_SHA" ]]
          [[ "$CONFIG_SHA" == "$(git rev-parse HEAD)" && "$CONFIG_SHA" != "$ACTION_SHA" ]]
          [[ "$TARGET" == example-owner/settings-fixture ]]
          [[ "$CLI_VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$CLI_SHA256" == "$EXPECTED_SHA256" ]]
          printf 'Action checkout: %s at %s\nConsumer checkout: %s at %s\n' \
            "$(git -C .action rev-parse --show-toplevel)" "$ACTION_SHA" \
            "$(git rev-parse --show-toplevel)" "$CONFIG_SHA"
          printf 'target=%s\ncli-version=%s\ncli-sha256=%s\n' "$TARGET" "$CLI_VERSION" "$CLI_SHA256"
