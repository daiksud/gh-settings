name: release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional immutable main commit to require (for reviewed dispatch)
        required: false
        type: string
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  # Serialize publication without cancelling an active release; ordering is not FIFO.
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read, actions: read}
    outputs:
      ci-run-id: ${{ steps.ci.outputs.ci-run-id }}
      source-sha: ${{ github.sha }}
      version: ${{ steps.metadata.outputs.version }}
      previous-tag: ${{ steps.metadata.outputs.previous-tag }}
      previous-sha: ${{ steps.metadata.outputs.previous-sha }}
      build-matrix: ${{ steps.metadata.outputs.build-matrix }}
      acceptance-matrix: ${{ steps.metadata.outputs.acceptance-matrix }}
    steps:
      - name: Require a main-branch dispatch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          [[ "$SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'release must be dispatched from main' >&2; exit 1
          }
      - name: Require the dispatched main commit to remain current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_main" == "$SOURCE_SHA" ]] || {
            echo 'main moved since dispatch; start a new release workflow' >&2; exit 1
          }
      - name: Validate the optional reviewed source pin
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'invalid source_sha (expected full 40-character SHA)' >&2; exit 1
            }
            [[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]] || {
              echo 'dispatched main differs from approved source_sha; refusing a different release source' >&2; exit 1
            }
          fi
      - name: Checkout frozen main and complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Inventory dependencies without changing workspace Action execution.
      - name: Lock dependencies of workspace Actions
        if: ${{ false }}
        uses: $/.github/actions/lock-workspace-dependencies
      - name: Require successful main CI, when present
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/release-ci.py status
      - name: Resolve release metadata and validated target matrices
        id: metadata
        uses: ./.github/actions/release-metadata
        with:
          source-sha: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
  reuse:
    needs: resolve
    runs-on: ubuntu-slim
    timeout-minutes: 12
    permissions: {contents: read, actions: read}
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
    steps:
      - name: Checkout frozen main to verify candidate artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover exact-SHA CI products
        id: lookup
        uses: ./.github/actions/release-reuse
        with:
          source-sha: ${{ github.sha }}
          version: ${{ needs.resolve.outputs.version }}
          ci-run-id: ${{ needs.resolve.outputs.ci-run-id }}
      - name: Transfer verified Linux product into this release run
        if: steps.lookup.outputs.reused == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-amd64
          path: ${{ runner.temp }}/reused-release/linux-amd64
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1
      - name: Transfer verified macOS product into this release run
        if: steps.lookup.outputs.reused == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-darwin-arm64
          path: ${{ runner.temp }}/reused-release/darwin-arm64
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 1
  commit-stage:
    needs: [resolve, reuse]
    if: needs.reuse.outputs.reused != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the frozen source and native target
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$TARGET" == linux-amd64 || "$TARGET" == darwin-arm64 ]] || exit 1
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
      - name: Set up pinned tools with mise cache
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
      - name: Lint source and workflows
        if: matrix.target == 'linux-amd64'
        uses: ./.github/actions/lint
      - name: Run unit tests
        if: matrix.target == 'linux-amd64'
        uses: ./.github/actions/unit-test
      - name: Build native executable
        id: build
        uses: ./.github/actions/build
        with:
          binary-name: gh-settings-${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
      - name: Package artifact and identity manifest
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          BUILT_SOURCE_SHA: ${{ steps.build.outputs.source-sha }}
          PRODUCT: ${{ steps.build.outputs.binary-path }}
        run: |
          [[ "$BUILT_SOURCE_SHA" == "$SOURCE_SHA" ]] || {
            echo 'built binary source differs from frozen commit' >&2
            exit 1
          }
          destination="$RUNNER_TEMP/release-$TARGET"
          bash .github/scripts/release-artifact.sh write \
            "$TARGET" "$VERSION" "$SOURCE_SHA" "$PRODUCT" "$destination"
          printf 'artifact-dir=%s\n' "$destination" >> "$GITHUB_OUTPUT"
      - name: Upload native product and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact-dir }}
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
          overwrite: true
  acceptance-stage:
    needs: [resolve, reuse, commit-stage]
    if: needs.reuse.outputs.reused != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.acceptance-matrix) }}
    steps:
      - name: Checkout frozen source separately from the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .action
          persist-credentials: false
      - name: Accept the transferred release artifact
        uses: ./.action/.github/actions/release-acceptance
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
          source-sha: ${{ github.sha }}
  delivery-gate:
    needs: [resolve, reuse, commit-stage, acceptance-stage]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require reuse or complete fresh Screening and Inspection
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e '
            .resolve.result == "success" and
            .reuse.result == "success" and
            (
              (.reuse.outputs.reused == "true" and
               .["commit-stage"].result == "skipped" and
               .["acceptance-stage"].result == "skipped") or
              (.reuse.outputs.reused != "true" and
               .["commit-stage"].result == "success" and
               .["acceptance-stage"].result == "success")
            )
          ' <<< "$RESULTS" > /dev/null
  release:
    needs: [resolve, delivery-gate]
    if: always() && needs.resolve.result == 'success' && needs.delivery-gate.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - name: Checkout frozen main and complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck main and ci-push before publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_RUN: ${{ needs.resolve.outputs.ci-run-id }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$SOURCE_SHA" ]] || {
            echo 'main advanced during release; abort publication' >&2
            exit 1
          }
          python3 .github/scripts/release-ci.py status "$EXPECTED_RUN"
      - name: Publish accepted release artifacts
        uses: ./.github/actions/release-publish
        with:
          source-sha: ${{ github.sha }}
          version: ${{ needs.resolve.outputs.version }}
          previous-tag: ${{ needs.resolve.outputs.previous-tag }}
          previous-sha: ${{ needs.resolve.outputs.previous-sha }}
        env:
          GH_TOKEN: ${{ github.token }}
  verify-release:
    needs: [resolve, release]
    if: always() && needs.resolve.result == 'success' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout frozen verification source separately from the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .action
          persist-credentials: false
      - name: Verify immutable published release
        uses: ./.action/.github/actions/release-verify
        with:
          source-sha: ${{ github.sha }}
          version: ${{ needs.resolve.outputs.version }}
