name: pr
on:
  pull_request:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screening:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned build tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          cache: false
      - name: Restore Go compilation and modules
        id: go-cache
        uses: ./.github/actions/restore-go-cache
      - name: Lint source and workflows
        uses: ./.github/actions/lint
      - name: Run unit tests
        uses: ./.github/actions/unit-test
      - name: Build executable
        uses: ./.github/actions/build
      - name: Save Go compilation and modules after successful checks
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ${{ steps.go-cache.outputs.build-path }}
            ${{ steps.go-cache.outputs.module-path }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
