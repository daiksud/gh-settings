name: pr
on:
  pull_request:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screening:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun from package manifest
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install development dependencies
        run: bun install --frozen-lockfile
      - name: Restore Go module and build caches
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Lint source and Markdown
        uses: ./.github/actions/lint
      - name: Run unit tests
        uses: ./.github/actions/unit-test
      - name: Build executable
        uses: ./.github/actions/build
