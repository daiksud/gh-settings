name: prlint
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: prlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prlint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Checkout message validation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install message validation tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          install_args: bun npm:@commitlint/cli
          cache: false
      - name: Validate current PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" |
            mise exec bun npm:@commitlint/cli -- bun run --bun --no-install "$(mise which commitlint)" --strict
