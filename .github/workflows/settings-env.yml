name: settings-env
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: settings-env-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  settings-env:
    name: settings-env
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout trusted main-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .policy
          persist-credentials: false
      - name: Checkout untrusted PR merge as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          path: .candidate
          persist-credentials: false
          # PR source is only inspected as YAML data; it is never executed.
          allow-unsafe-pr-checkout: true
      - name: Install pinned Go for the trusted policy
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.8
          working_directory: .policy
          install_args: go
          cache: false
      - name: Validate candidate workflows using trusted policy
        working-directory: .policy
        env:
          GH_SETTINGS_WORKFLOWS_DIR: ${{ github.workspace }}/.candidate/.github/workflows
        run: go test -count=1 -run '^TestSettingsEnvironmentScope' ./tests/github-actions
