name: temporary archive integration snapshot
on:
  push:
    branches: [archive-332-integration-snapshot]
    paths: [.github/workflows/archive-integration-snapshot.yml]
permissions: {contents: read}
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the fixed implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 19a60eb21f31dff29ce0ecff67ecd33574ed98a2
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle public source without execution
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot"
          git bundle create "$RUNNER_TEMP/snapshot/source.bundle" HEAD --tags
          git rev-parse HEAD > "$RUNNER_TEMP/snapshot/SOURCE_SHA"
      - name: Transfer public source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-332-integration-source
          path: ${{ runner.temp }}/snapshot
          retention-days: 1
          if-no-files-found: error
