name: Verify candidate Action Topics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-public-action-test-gh-settings-public
  cancel-in-progress: false
jobs:
  topics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'daiksud/gh-settings'
    environment: gh-settings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed probe source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .verification-source
          persist-credentials: false
      - name: Require a successful exact-SHA main deployment
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd .verification-source
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 .github/scripts/release-ci.py probe
      - name: Download only the selected CI Linux product
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ci.outputs.linux-id }}
          path: ${{ runner.temp }}/topics-candidate-linux
          github-token: ${{ github.token }}
          repository: daiksud/gh-settings
          run-id: ${{ steps.ci.outputs.ci-run-id }}
          digest-mismatch: error
      - name: Verify candidate manifest and prepare the bounded installer fixture
        id: candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.ci.outputs.version }}
        run: |
          set -euo pipefail
          [[ -z ${GH_TOKEN:-} && -z ${GITHUB_TOKEN:-} && -z ${GH_CONFIG_DIR:-} ]]
          [[ "$GITHUB_API_URL" == https://api.github.com ]]
          source="$GITHUB_WORKSPACE/.verification-source"
          [[ "$(git -C "$source" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git -C "$source" status --porcelain)" ]]
          directory="$RUNNER_TEMP/topics-candidate-linux"
          bash "$source/.github/scripts/release-artifact.sh" verify linux-amd64 "$VERSION" "$SOURCE_SHA" "$directory" "$GITHUB_OUTPUT"
          digest="$(sed -n 's/^sha256=//p' "$GITHUB_OUTPUT")"
          bash "$source/tests/github-actions/prepare-candidate-download.sh" "$directory/gh-settings-linux-amd64" "$digest" "$SOURCE_SHA" "$VERSION"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Recheck the CI producer before issuing any live token
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.ci-run-id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.ci-run-attempt }}
        run: |
          set -euo pipefail
          cd .verification-source
          python3 .github/scripts/release-ci.py status "$CI_RUN_ID" "$CI_RUN_ATTEMPT"
      - name: Mint a token only for the dedicated test repository
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.ANSWER26_CLIENT_ID }}
          private-key: ${{ secrets.ANSWER26_PRIVATE_KEY }}
          owner: daiksud
          repositories: test-gh-settings-public
          permission-administration: write
      - name: Observe original Topics and create an isolated local consumer
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .verification-source/.github/scripts/verify-public-topics.py prepare
      - name: Validate through the candidate root Action and bounded installer fixture
        id: validate
        uses: ./.verification-source
        with:
          command: validate
      - name: Plan the single-topic addition
        uses: ./.verification-source
        with:
          command: plan
          token: ${{ steps.app.outputs.token }}
      - name: Check package identity and fresh baseline immediately before apply
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_CLI_VERSION: ${{ steps.candidate.outputs.version }}
          EXPECTED_CLI_SHA256: ${{ steps.candidate.outputs.sha256 }}
          ACTION_TARGET: ${{ steps.validate.outputs.target }}
          ACTION_VERSION: ${{ steps.validate.outputs.cli-version }}
          ACTION_DIGEST: ${{ steps.validate.outputs.cli-sha256 }}
        run: |
          set -euo pipefail
          [[ "$(git -C .verification-source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git -C .verification-source status --porcelain)" ]]
          python3 .verification-source/.github/scripts/verify-public-topics.py arm
      - name: Apply Topics through the candidate root Action
        uses: ./.verification-source
        with:
          command: apply
          token: ${{ steps.app.outputs.token }}
      - name: Independently read back the topic set
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .verification-source/.github/scripts/verify-public-topics.py verify-desired
      - name: Plan the matching repeat
        id: repeat-plan
        uses: ./.verification-source
        with:
          command: plan
          plan-reporting: status-only
          token: ${{ steps.app.outputs.token }}
      - name: Require a no-difference plan and recheck before repeat apply
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN_OUTCOME: ${{ steps.repeat-plan.outputs.plan-outcome }}
        run: python3 .verification-source/.github/scripts/verify-public-topics.py verify-repeat
      - name: Repeat apply through the candidate root Action
        uses: ./.verification-source
        with:
          command: apply
          token: ${{ steps.app.outputs.token }}
      - name: Independently read back the repeat
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .verification-source/.github/scripts/verify-public-topics.py verify-desired
      - name: Check for conflicts before preparing restoration
        id: restore-config
        if: always() && steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .verification-source/.github/scripts/verify-public-topics.py restore-config
      - name: Restore original Topics through the candidate root Action
        if: always() && steps.restore-config.outputs.ready == 'true'
        uses: ./.verification-source
        with:
          command: apply
          token: ${{ steps.app.outputs.token }}
      - name: Independently verify restoration
        if: always() && steps.restore-config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .verification-source/.github/scripts/verify-public-topics.py verify-restored
      - name: Plan the restored baseline
        id: final-plan
        if: always() && steps.restore-config.outputs.ready == 'true'
        uses: ./.verification-source
        with:
          command: plan
          plan-reporting: status-only
          token: ${{ steps.app.outputs.token }}
      - name: Require the restored no-difference plan and final independent readback
        if: always() && steps.restore-config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN_OUTCOME: ${{ steps.final-plan.outputs.plan-outcome }}
        run: python3 .verification-source/.github/scripts/verify-public-topics.py verify-final-plan
