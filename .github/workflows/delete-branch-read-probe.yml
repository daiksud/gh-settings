name: Delete branch read-only probe
on:
  pull_request:
    paths:
      - .github/workflows/delete-branch-read-probe.yml
permissions:
  contents: read
jobs:
  read-only-delete-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the single merge policy boolean
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { repository(owner: "daiksud", name: "gh-settings") { deleteBranchOnMerge } }' > "$RUNNER_TEMP/delete-branch.json"
          python3 - "$RUNNER_TEMP/delete-branch.json" <<'PY'
          import json,sys
          response=json.load(open(sys.argv[1]))
          assert not response.get('errors')
          repository=response['data']['repository']
          assert set(repository)=={'deleteBranchOnMerge'}
          assert type(repository['deleteBranchOnMerge']) is bool
          print(json.dumps(repository))
          PY
