name: Squash defaults read-only proof
on:
  pull_request:
    paths: [.github/workflows/squash-defaults-read-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read fixed merge-related fields with the ordinary Actions token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { repository(owner:"daiksud", name:"gh-settings") { mergeCommitAllowed squashMergeAllowed rebaseMergeAllowed deleteBranchOnMerge squashMergeCommitTitle squashMergeCommitMessage } }' > observation.json
          python3 - <<'PY'
          import json
          response = json.load(open('observation.json'))
          assert not response.get('errors'), response
          fields = response['data']['repository']
          assert fields == {
              'mergeCommitAllowed': False,
              'squashMergeAllowed': True,
              'rebaseMergeAllowed': False,
              'deleteBranchOnMerge': True,
              'squashMergeCommitTitle': 'COMMIT_OR_PR_TITLE',
              'squashMergeCommitMessage': 'COMMIT_MESSAGES',
          }, fields
          assert all(type(fields[key]) is bool for key in ['mergeCommitAllowed', 'squashMergeAllowed', 'rebaseMergeAllowed', 'deleteBranchOnMerge'])
          print(json.dumps(fields, sort_keys=True))
          PY
