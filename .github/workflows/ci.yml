name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pass:
    name: pass
    # The hosted slim image includes Git, GCC, and Python for these checks.
    runs-on: ubuntu-slim
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Static analysis
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -count=1 -vet=off ./...
      - name: Build
        run: go build -o "$RUNNER_TEMP/gh-settings" .
      - name: Install pinned Markdown checker
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --target "$RUNNER_TEMP/ci-tools" -r .github/requirements-ci.txt
      - name: Check Markdown and local links
        run: '"$RUNNER_TEMP/ci-tools/bin/rumdl" check --no-cache --deny-config-warnings README.md docs'
