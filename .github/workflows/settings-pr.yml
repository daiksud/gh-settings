name: settings-pr
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  settings-pr:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: daiksud/gh-settings@2079ede46bcb3369d9575c1941ac88e4a37c081d # v0.44.1
        with:
          command: validate
