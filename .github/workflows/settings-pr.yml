name: Settings PR plan
on:
  pull_request:
    paths:
      - .github/settings.yml
      - .github/workflows/settings-pr.yml
      - examples/github-actions/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: settings-pr-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout containing repository PR merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and plan with the public Action
        uses: daiksud/gh-settings@9d01d3258d9f42239b2daeb1ac26bc532cd56105 # v0.6.1
        with:
          command: plan
          token: ${{ github.token }}
