name: settings-pr
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  settings-pr:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: daiksud/gh-settings@b074b1de2e7cbc7f623cc0e31bcab71d681d166d # v0.45.0
        with:
          command: validate
