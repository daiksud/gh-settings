name: settings-pr
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  settings-pr:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: daiksud/gh-settings@4ca411bf1accb2c6221f64b4f3bbb59fbe20d933 # v0.33.0
        with:
          command: validate
