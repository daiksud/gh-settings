name: One-time v0.7.1 release dispatch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-v0.7.1.yml
permissions: {}
concurrency:
  group: dispatch-v0.7.1
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'daiksud/gh-settings' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: v0.7.1
    steps:
      - name: Dispatch approved release workflow
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == daiksud/gh-settings ]]
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/action/cli-version?ref=$GITHUB_SHA" --jq .content | base64 --decode)
          [[ "$version" == "$RELEASE_VERSION" ]] || {
            echo "Committed CLI version differs from $RELEASE_VERSION" >&2
            exit 1
          }
          # Refuse to dispatch if main advanced since this approved push.
          # The release resolve job independently enforces the same source SHA.
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo "main moved since the approved dispatch commit" >&2
            exit 1
          }
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "version=$RELEASE_VERSION" -f "source_sha=$GITHUB_SHA"
