name: temporary archive implementation transfer
on:
  push:
    branches: [archive-lifecycle-332]
    paths: [.github/workflows/workspace-snapshot.yml]
permissions: {}
jobs:
  apply-reviewed-patch:
    if: github.repository == 'daiksud/gh-settings' && github.ref == 'refs/heads/archive-lifecycle-332'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write}
    steps:
      - name: Checkout the exact owned topic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: archive-lifecycle-332
          persist-credentials: true
      - name: Install reviewed source changes, delete this transient workflow, and push
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RUN_SHA" ]] || { echo 'Unexpected topic revision' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/2f6d76247df019c7b3e7079b8c49940b90bbbb2b" --jq '.content' | base64 --decode > "$RUNNER_TEMP/archive332.patch.xz"
          printf '%s  %s\n' b450fdb02df701f5dbfb21f6a887b6b75a52495aefdd5dbf0528ef514611567d "$RUNNER_TEMP/archive332.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/archive332.patch.xz" > "$RUNNER_TEMP/archive332.patch"
          git apply --check "$RUNNER_TEMP/archive332.patch"
          git apply "$RUNNER_TEMP/archive332.patch"
          rm .github/workflows/workspace-snapshot.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(settings): manage repository archive lifecycle'
          git push origin HEAD:refs/heads/archive-lifecycle-332
