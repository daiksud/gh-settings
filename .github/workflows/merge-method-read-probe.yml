name: Merge method read-only probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/merge-method-read-probe.yml]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  read-only-merge-methods:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: read}
    steps:
      - name: Read only the three merge-method booleans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api graphql --hostname github.com -f query='query {
            repository(owner: "daiksud", name: "gh-settings") {
              mergeCommitAllowed
              squashMergeAllowed
              rebaseMergeAllowed
            }
          }' --jq '.data.repository' > "$RUNNER_TEMP/merge-methods.json"
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'merge-methods.json').read_text())
          expected = {'mergeCommitAllowed', 'squashMergeAllowed', 'rebaseMergeAllowed'}
          assert isinstance(data, dict) and set(data) == expected, 'missing repository or field'
          assert all(type(value) is bool for value in data.values()), 'non-boolean merge method'
          print(json.dumps(data, sort_keys=True))
          PY
