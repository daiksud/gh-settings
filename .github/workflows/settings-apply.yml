name: settings-apply
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: settings-main-${{ github.repository }}
  cancel-in-progress: false
jobs:
  settings-apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: gh-settings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.ANSWER26_CLIENT_ID }}
          private-key: ${{ secrets.ANSWER26_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
          permission-issues: write
      - uses: daiksud/gh-settings@01cd465f5c4ff506b39de70261707d5c6fa22943 # v0.47.0
        with:
          command: apply
          token: ${{ steps.app.outputs.token }}
