name: settings-apply
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: settings-main-${{ github.repository }}
  cancel-in-progress: false
jobs:
  settings-apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: gh-settings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.ANSWER26_CLIENT_ID }}
          private-key: ${{ secrets.ANSWER26_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
          permission-issues: write
      - uses: daiksud/gh-settings@0c775795b4dd7fedef7d500f248fbdd782ff211a # v0.38.0
        with:
          command: apply
          token: ${{ steps.app.outputs.token }}
