name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Read the trusted base branch's rules. Never check out or execute PR
      # code in this write-capable pull_request_target workflow.
      - name: Sync documentation triage
        # Post-v7.0.0 fix: preserve externally managed labels during synchronization.
        uses: actions/labeler@bc32c493030cc908233048429a1f81da3057fbbc
        with:
          sync-labels: true
          dot: true
