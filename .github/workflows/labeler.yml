name: Labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  labeler:
    if: github.event.pull_request.changed_files > 0
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Read the base repository configuration through the API. Never check out
      # or execute candidate code in this write-capable PR-target workflow.
      - name: Suggest labels from unambiguous paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
          dot: true
