name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Read the trusted base branch's rules. Never check out or execute PR
      # code in this write-capable pull_request_target workflow.
      - name: Label changed files
        # v7.0.0 uses whole-list replacement: concurrent external label updates
        # can be lost or restored despite its pre-write refresh.
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          # Dependabot can update a uses: pin without changing a lockfile.
          sync-labels: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
          dot: true
