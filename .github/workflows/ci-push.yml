name: ci-push
on:
  push:
    branches: [main]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build-matrix: ${{ steps.metadata.outputs.build-matrix }}
      acceptance-matrix: ${{ steps.metadata.outputs.acceptance-matrix }}
    steps:
      - name: Checkout frozen main and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Inventory dependencies without changing workspace Action execution.
      - name: Lock dependencies of workspace Actions
        if: ${{ false }}
        uses: $/.github/actions/lock-workspace-dependencies
      - name: Resolve exact main candidate version and target matrices
        id: metadata
        uses: ./.github/actions/release-metadata
        with:
          source-sha: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
  commit-stage:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Screen and build native release-ready candidate
        uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
          source-sha: ${{ github.sha }}
          overwrite: 'true'
  acceptance-stage:
    needs: [resolve, commit-stage]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.acceptance-matrix) }}
    steps:
      - name: Checkout candidate source separately from the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .action
          persist-credentials: false
      - name: Inspect exact built and transferred candidate
        uses: ./.action/.github/actions/release-acceptance
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
          source-sha: ${{ github.sha }}
  ci-push:
    needs: [resolve, commit-stage, acceptance-stage]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require Screening and Inspection to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'length == 3 and all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
