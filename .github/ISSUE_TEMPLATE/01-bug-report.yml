name: Bug report
description: Report unexpected behavior in the CLI or GitHub Action.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/daiksud/gh-settings/issues) before opening a report.
        Remove tokens, private keys, and other secrets from configuration and logs.
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what happened and how it affected your work.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Include the exact command or workflow steps and a minimal `.github/settings.yml` when relevant.
        If the problem is intermittent, describe the conditions you have observed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: |
        Include `gh settings --version` and `gh --version` for the CLI, or the `uses` ref for the Action.
        Add the OS/runner and, for a source build, the source commit. If a value is unavailable, say so.
      placeholder: |
        Usage: CLI / GitHub Action / source build
        Version or Action ref:
        GitHub CLI version:
        OS or runner:
        Source commit, if applicable:
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Logs and additional context
      description: Include relevant output, exit codes, workflow run links, or screenshots.
