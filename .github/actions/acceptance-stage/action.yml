name: Acceptance stage
description: Check the transferred product binary through a local API fixture.
inputs:
  binary-path:
    description: Downloaded product binary, built in commit-stage.
    required: true
  binary-sha256:
    description: Expected SHA-256 from commit-stage.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Go for the acceptance harness
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        check-latest: true
        cache: true
    - name: Verify the same product binary
      shell: bash
      env:
        BINARY_PATH: ${{ inputs.binary-path }}
        EXPECTED_SHA256: ${{ inputs.binary-sha256 }}
      run: |
        [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
        printf '%s  %s\n' "$EXPECTED_SHA256" "$BINARY_PATH" | sha256sum -c -
        chmod +x "$BINARY_PATH"
    - name: Run process-level acceptance checks
      shell: bash
      env:
        BINARY_PATH: ${{ inputs.binary-path }}
      run: go run ./tests/acceptance --binary "$BINARY_PATH"
