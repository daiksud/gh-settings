name: Restore Go cache
description: Restore compatible Go compilation and module downloads in unprivileged PR/main CI.
outputs:
  build-path:
    description: Resolved Go compilation cache directory.
    value: ${{ steps.go-cache.outputs.build-path }}
  module-path:
    description: Resolved Go module cache directory.
    value: ${{ steps.go-cache.outputs.module-path }}
  cache-hit:
    description: Whether restore found the exact source revision.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: Exact cache key resolved for this source revision.
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Resolve Go cache identity
      id: go-cache
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      shell: bash
      run: |
        set -euo pipefail
        printf 'build-path=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        printf 'module-path=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        environment="$(
          {
            cat /etc/os-release
            go version
            go env GOOS GOARCH GOAMD64 GOARM64 CGO_ENABLED GOEXPERIMENT GOFLAGS CC CXX
            gcc --version
            ldd --version
          } | sha256sum | cut -d ' ' -f 1
        )"
        printf 'environment=%s\n' "$environment" >> "$GITHUB_OUTPUT"
    - name: Restore Go compilation and modules
      id: restore
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      with:
        path: |
          ${{ steps.go-cache.outputs.build-path }}
          ${{ steps.go-cache.outputs.module-path }}
        key: go-ci-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-slim-${{ steps.go-cache.outputs.environment }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml', '.github/actions/setup-tools/action.yml', '.github/actions/restore-go-cache/action.yml', '.github/actions/save-go-cache/action.yml', '.github/actions/lint/action.yml', '.github/actions/unit-test/action.yml', '.github/actions/build/action.yml') }}-${{ github.sha }}
        restore-keys: |
          go-ci-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-slim-${{ steps.go-cache.outputs.environment }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml', '.github/actions/setup-tools/action.yml', '.github/actions/restore-go-cache/action.yml', '.github/actions/save-go-cache/action.yml', '.github/actions/lint/action.yml', '.github/actions/unit-test/action.yml', '.github/actions/build/action.yml') }}-
