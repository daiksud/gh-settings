name: Resolve release metadata
description: Select the version for a main commit and determine whether it needs publication.
inputs:
  source-sha:
    description: Exact frozen main commit.
    required: true
  promote-to-v1:
    description: Explicit initial v0-to-v1 promotion to v1.0.1; false uses normal SemVer.
    required: false
    default: 'false'
outputs:
  version:
    description: Candidate version, pending native comparison when compare-binaries is true.
    value: ${{ steps.resolve.outputs.version }}
  previous-tag:
    description: Previous published stable tag, empty only for an immutable retry.
    value: ${{ steps.resolve.outputs.previous-tag }}
  previous-sha:
    description: Previous published stable source, empty only for an immutable retry.
    value: ${{ steps.resolve.outputs.previous-sha }}
  release-needed:
    description: True for a candidate or an immutable retry. A provisional patch also requires a changed native binary.
    value: ${{ steps.resolve.outputs.release-needed }}
  compare-binaries:
    description: True when the frozen predecessor and source need native Linux and macOS binary comparison to decide PATCH.
    value: ${{ steps.resolve.outputs.compare-binaries }}
runs:
  using: composite
  steps:
    - name: Resolve and validate release metadata
      id: resolve
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        PROMOTE_TO_V1: ${{ inputs.promote-to-v1 }}
      run: |
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid metadata source' >&2; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'metadata checkout differs from frozen source' >&2; exit 1; }
        args=(--allow-retry)
        case "$PROMOTE_TO_V1" in
          false) ;;
          true) args+=(--graduate-to-v1) ;;
          *) echo 'promote-to-v1 must be true or false' >&2; exit 1 ;;
        esac
        python3 .github/scripts/release-version.py "${args[@]}"
