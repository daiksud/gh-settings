name: CI acceptance stage
description: Verify and accept the transferred candidate without rebuilding it.
inputs:
  target:
    description: Static target selected by CI metadata.
    required: true
  kind:
    description: 'Acceptance kind: process or public-action.'
    required: true
  source-sha:
    description: Immutable workflow source commit.
    required: true
  artifact-directory:
    description: Downloaded artifact directory.
    required: true
runs:
  using: composite
  steps:
    - name: Verify candidate manifest and bytes
      id: verify
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        KIND: ${{ inputs.kind }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
      run: |
        set -euo pipefail
        [[ "$TARGET" == linux-amd64 ]] || { echo 'invalid artifact target' >&2; exit 1; }
        [[ "$KIND" == process || "$KIND" == public-action ]] || { echo 'invalid acceptance kind' >&2; exit 1; }
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid artifact source' >&2; exit 1; }
        [[ "$(git -C .action rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'artifact checkout differs from source' >&2; exit 1; }
        [[ "$(find "$ARTIFACT_DIRECTORY" -maxdepth 1 -type f -print | wc -l | tr -d ' ')" == 2 ]] || { echo 'artifact inventory differs' >&2; exit 1; }
        manifest="$ARTIFACT_DIRECTORY/manifest.json"
        binary="$ARTIFACT_DIRECTORY/gh-settings"
        identity="$(python3 .action/.github/scripts/ci-manifest.py "$manifest" "$SOURCE_SHA" "$TARGET")"
        expected_sha256="${identity%% *}"
        product_version="${identity#* }"
        actual_sha256="$(sha256sum "$binary" | cut -d ' ' -f 1)"
        [[ "$actual_sha256" == "$expected_sha256" ]] || { echo 'artifact bytes differ from manifest' >&2; exit 1; }
        chmod +x "$binary"
        printf 'binary-path=%s\nbinary-sha256=%s\nproduct-version=%s\n' \
          "$binary" "$expected_sha256" "$product_version" >> "$GITHUB_OUTPUT"
    - name: Run process acceptance without rebuilding
      if: inputs.kind == 'process'
      uses: ./.action/.github/actions/integration-test
      with:
        binary-path: ${{ steps.verify.outputs.binary-path }}
        binary-sha256: ${{ steps.verify.outputs.binary-sha256 }}
        version: ${{ steps.verify.outputs.product-version }}
        source-directory: .action
    - name: Set up Go from source module
      if: inputs.kind == 'public-action'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .action/go.mod
        cache: false
    - name: Exercise the candidate public Action
      if: inputs.kind == 'public-action'
      uses: ./.action/.github/actions/e2e-test
      with:
        source-sha: ${{ inputs.source-sha }}
        cli-version: ${{ steps.verify.outputs.product-version }}
        binary-sha256: ${{ steps.verify.outputs.binary-sha256 }}
        binary-path: ${{ steps.verify.outputs.binary-path }}
