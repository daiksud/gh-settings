name: Save Go cache
description: Save Go compilation and module downloads after successful source checks and build.
inputs:
  build-path:
    description: Go compilation cache directory resolved during restore.
    required: true
  module-path:
    description: Go module cache directory resolved during restore.
    required: true
  cache-hit:
    description: Whether restore found the exact source revision.
    required: false
    default: ''
  cache-primary-key:
    description: Exact cache key resolved during restore.
    required: true
runs:
  using: composite
  steps:
    - name: Save Go compilation and modules
      if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && inputs.cache-hit != 'true' && inputs.cache-primary-key != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: |
          ${{ inputs.build-path }}
          ${{ inputs.module-path }}
        key: ${{ inputs.cache-primary-key }}
