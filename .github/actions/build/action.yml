name: Build
description: Build one native executable and report its path.
inputs:
  version:
    description: Stable release version to embed. An empty input uses the CLI's development version.
    required: false
    default: ''
outputs:
  binary-path:
    description: Native product executable path.
    value: ${{ steps.build.outputs.binary-path }}
runs:
  using: composite
  steps:
    - name: Build the product binary once
      id: build
      shell: bash
      env:
        BUILD_VERSION: ${{ inputs.version }}
      run: |
        ldflags=''
        if [[ -n "$BUILD_VERSION" ]]; then
          [[ "$BUILD_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'build version must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          }
          ldflags="-X main.version=$BUILD_VERSION"
        fi
        go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/gh-settings" .
        printf 'binary-path=%s\n' "$RUNNER_TEMP/gh-settings" >> "$GITHUB_OUTPUT"
