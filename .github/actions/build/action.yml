name: Build
description: Build one native executable and report its path, source commit and SHA-256.
inputs:
  binary-name:
    description: Output executable name.
    required: false
    default: gh-settings
  version:
    description: Stable release version to embed. An empty input uses the CLI's development version.
    required: false
    default: ''
outputs:
  binary-path:
    description: Native product executable path.
    value: ${{ steps.build.outputs.binary-path }}
  binary-sha256:
    description: SHA-256 of the native executable.
    value: ${{ steps.build.outputs.binary-sha256 }}
  source-sha:
    description: Checked-out source SHA used to build.
    value: ${{ steps.build.outputs.source-sha }}
runs:
  using: composite
  steps:
    - name: Build the product binary once
      id: build
      shell: bash
      env:
        BINARY_NAME: ${{ inputs.binary-name }}
        BUILD_VERSION: ${{ inputs.version }}
      run: |
        ldflags=''
        if [[ -n "$BUILD_VERSION" ]]; then
          [[ "$BUILD_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'build version must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          }
          ldflags="-X main.version=$BUILD_VERSION"
        fi
        source_sha="$(git rev-parse HEAD)"
        [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
        go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/$BINARY_NAME" .
        printf 'binary-path=%s\n' "$RUNNER_TEMP/$BINARY_NAME" >> "$GITHUB_OUTPUT"
        if command -v sha256sum > /dev/null; then
          digest="$(sha256sum "$RUNNER_TEMP/$BINARY_NAME" | cut -d ' ' -f 1)"
        else
          digest="$(shasum -a 256 "$RUNNER_TEMP/$BINARY_NAME" | cut -d ' ' -f 1)"
        fi
        printf 'binary-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
        printf 'source-sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
