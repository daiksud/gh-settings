name: Commit stage
description: Check source and build the product binary once.
inputs:
  cache-go:
    description: Reuse Go compilation and module downloads in unprivileged PR/main CI.
    required: false
    default: 'false'
  binary-name:
    description: Output binary name.
    required: false
    default: gh-settings
  version:
    description: Explicit release version; empty uses the committed candidate version.
    required: false
    default: ''
outputs:
  binary-path:
    description: Location of the built binary on this runner.
    value: ${{ steps.build.outputs.binary-path }}
  binary-sha256:
    description: SHA-256 of the built product binary.
    value: ${{ steps.build.outputs.binary-sha256 }}
  source-sha:
    description: Full checked-out source commit used by this build.
    value: ${{ steps.build.outputs.source-sha }}
  cli-version:
    description: CLI version injected into this product binary.
    value: ${{ steps.build.outputs.cli-version }}
runs:
  using: composite
  steps:
    - name: Install development tools
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: 2026.10.8
        cache: false
    - name: Resolve Go cache identity
      id: go-cache
      if: inputs.cache-go == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      shell: bash
      run: |
        set -euo pipefail
        printf 'build-path=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        printf 'module-path=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        environment="$(
          {
            cat /etc/os-release
            go version
            go env GOOS GOARCH GOAMD64 GOARM64 CGO_ENABLED GOEXPERIMENT GOFLAGS CC CXX
            gcc --version
            ldd --version
          } | sha256sum | cut -d ' ' -f 1
        )"
        printf 'environment=%s\n' "$environment" >> "$GITHUB_OUTPUT"
    - name: Restore Go compilation and modules
      if: inputs.cache-go == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      with:
        path: |
          ${{ steps.go-cache.outputs.build-path }}
          ${{ steps.go-cache.outputs.module-path }}
        key: go-ci-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-slim-${{ steps.go-cache.outputs.environment }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml', '.github/actions/commit-stage/action.yml') }}-${{ github.sha }}
        restore-keys: |
          go-ci-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-slim-${{ steps.go-cache.outputs.environment }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml', '.github/actions/commit-stage/action.yml') }}-
    - name: Check GitHub workflows and shell scripts
      shell: bash
      run: |
        actionlint -shellcheck shellcheck .github/workflows/*.yml examples/github-actions/*.yml
        shellcheck scripts/publish-release.sh tests/release.sh tests/github-actions/*.sh
        shellcheck action/*.sh
        shellcheck .github/scripts/*.sh
    - name: Verify Go formatting
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [[ -n "$unformatted" ]]; then
          printf 'Run gofmt on:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: Verify modules
      shell: bash
      run: |
        go mod download
        go mod verify
        go mod tidy -diff
    - name: Static analysis
      shell: bash
      run: go vet ./...
    - name: Test with race detection
      shell: bash
      run: go test -race -count=1 -vet=off ./...
    - name: Test release recovery without GitHub
      shell: bash
      run: bash tests/release.sh
    - name: Test settings examples without GitHub
      shell: bash
      run: |
        bash tests/github-actions/action-install.sh
    - name: Build the product binary once
      id: build
      shell: bash
      env:
        BINARY_NAME: ${{ inputs.binary-name }}
        BUILD_VERSION: ${{ inputs.version }}
      run: |
        version="${BUILD_VERSION:-$(cat action/cli-version)}"
        [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        source_sha="$(git rev-parse HEAD)"
        [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
        go build -trimpath -ldflags "-X main.version=$version" -o "$RUNNER_TEMP/$BINARY_NAME" .
        printf 'binary-path=%s\n' "$RUNNER_TEMP/$BINARY_NAME" >> "$GITHUB_OUTPUT"
        printf 'binary-sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/$BINARY_NAME" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        printf 'source-sha=%s\ncli-version=%s\n' "$source_sha" "$version" >> "$GITHUB_OUTPUT"
    - name: Check Markdown and local links
      shell: bash
      run: rumdl check --no-cache --deny-config-warnings README.md CONTRIBUTING.md AGENTS.md .agents .github/pull_request_template.md docs examples/github-actions
