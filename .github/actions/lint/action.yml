name: Lint
description: Check Go formatting, modules, vet, and Markdown.
runs:
  using: composite
  steps:
    - name: Verify Go formatting
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [[ -n "$unformatted" ]]; then
          printf 'Run gofmt on:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: Verify modules
      shell: bash
      run: |
        go mod download
        go mod verify
        go mod tidy -diff
    - name: Static analysis
      shell: bash
      run: go vet ./...
    - name: Check Markdown and local links
      shell: bash
      run: bun run lint:markdown
