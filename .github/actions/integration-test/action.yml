name: Integration test
description: Exercise the previously built product binary against the local API acceptance fixture.
inputs:
  binary-path:
    description: Downloaded product binary produced by the build Action.
    required: true
  binary-sha256:
    description: Expected SHA-256 from the build Action.
    required: true
  version:
    description: Expected candidate or release CLI version; empty skips the check.
    required: false
    default: ''
  source-directory:
    description: Checked-out source root containing the acceptance harness.
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Set up Go from source module
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: ${{ inputs.source-directory }}/go.mod
        cache: false
    - name: Verify the same product binary
      shell: bash
      env:
        BINARY_PATH: ${{ inputs.binary-path }}
        EXPECTED_SHA256: ${{ inputs.binary-sha256 }}
      run: |
        [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
          echo 'invalid expected binary digest' >&2; exit 1
        }
        if command -v sha256sum > /dev/null; then
          actual="$(sha256sum "$BINARY_PATH" | cut -d ' ' -f 1)"
        else
          actual="$(shasum -a 256 "$BINARY_PATH" | cut -d ' ' -f 1)"
        fi
        [[ "$actual" == "$EXPECTED_SHA256" ]] || {
          echo 'accepted binary digest mismatch' >&2; exit 1
        }
        chmod +x "$BINARY_PATH"
    - name: Verify embedded CLI version
      if: inputs.version != ''
      shell: bash
      env:
        BINARY_PATH: ${{ inputs.binary-path }}
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        [[ "$("$BINARY_PATH" --version)" == "gh-settings $EXPECTED_VERSION" ]] || {
          echo 'accepted binary version mismatch' >&2; exit 1
        }
    - name: Run process-level acceptance checks
      shell: bash
      working-directory: ${{ inputs.source-directory }}
      env:
        BINARY_PATH: ${{ inputs.binary-path }}
      run: go test -tags=acceptance -count=1 ./tests/acceptance -args -binary "$BINARY_PATH"
