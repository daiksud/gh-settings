name: Accept release artifact
description: Verify one transferred manifest and run its native or public Action acceptance lane.
inputs:
  target:
    description: Allowlisted acceptance target.
    required: true
  version:
    description: Prepared release version.
    required: true
  source-sha:
    description: Exact frozen main commit.
    required: true
runs:
  using: composite
  steps:
    - name: Validate frozen acceptance identity
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        [[ "$TARGET" == linux-amd64 || "$TARGET" == darwin-arm64 || "$TARGET" == candidate-action ]] || { echo 'invalid acceptance target' >&2; exit 1; }
        [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'invalid acceptance version' >&2; exit 1; }
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid acceptance source' >&2; exit 1; }
        [[ "$(git -C .action rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'acceptance checkout differs from frozen source' >&2; exit 1; }
        [[ "$(cat .action/action/cli-version)" == "$VERSION" ]] || { echo 'accepted CLI version differs from release' >&2; exit 1; }
    - name: Retrieve the Linux release artifact
      if: inputs.target == 'linux-amd64' || inputs.target == 'candidate-action'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-linux-amd64
        path: ${{ runner.temp }}/accepted-linux-amd64
        digest-mismatch: error
    - name: Retrieve the macOS release artifact
      if: inputs.target == 'darwin-arm64'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-darwin-arm64
        path: ${{ runner.temp }}/accepted-darwin-arm64
        digest-mismatch: error
    - name: Verify the transferred manifest and product bytes
      id: artifact
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        artifact_target=$TARGET
        [[ "$artifact_target" != candidate-action ]] || artifact_target=linux-amd64
        bash .action/.github/scripts/release-artifact.sh verify \
          "$artifact_target" "$VERSION" "$SOURCE_SHA" \
          "$RUNNER_TEMP/accepted-$artifact_target" "$GITHUB_OUTPUT"
    - name: Run native product acceptance
      if: inputs.target == 'linux-amd64' || inputs.target == 'darwin-arm64'
      uses: ./.action/.github/actions/acceptance-stage
      with:
        binary-path: ${{ steps.artifact.outputs.asset-path }}
        binary-sha256: ${{ steps.artifact.outputs.sha256 }}
        version: ${{ inputs.version }}
        source-directory: .action
    - name: Validate the candidate public Action
      if: inputs.target == 'candidate-action'
      uses: ./.action/.github/actions/candidate-smoke
      with:
        source-sha: ${{ inputs.source-sha }}
        cli-version: ${{ inputs.version }}
        binary-sha256: ${{ steps.artifact.outputs.sha256 }}
        binary-path: ${{ steps.artifact.outputs.asset-path }}
