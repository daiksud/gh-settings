name: Settings main apply (example)
on:
  push:
    branches: [main]
    paths:
      - .github/settings.yml
      - .github/workflows/settings-main.yml
permissions:
  contents: read
concurrency:
  group: settings-main-${{ github.repository }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: settings-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - uses: daiksud/gh-settings@235af9170a7e40fa393f54613d39bf3623f1448e # v0.15.0
        with:
          command: apply
          token: ${{ steps.app.outputs.token }}
