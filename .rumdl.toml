[global]
disable = ["line-length", "no-inline-html", "no-bare-urls", "first-line-heading"]
extend-enable = ["link-fragments", "existing-relative-links"]

[table-format]
enabled = true
style = "compact"

[single-title]
# GitHub shows YAML frontmatter as metadata. Count the visible Markdown title.
front-matter-title = ""

[list-item-spacing]
style = "tight"
allow-loose-continuation = true
